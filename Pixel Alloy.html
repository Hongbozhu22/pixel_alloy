    var wpn=getW();
    ctx.textAlign='right';ctx.textBaseline='top';
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-234,160,220,60);
    ctx.fillStyle=wpn.color;ctx.font='bold 16px "Courier New",monospace';
    ctx.fillText(wpn.icon+' '+wpn.name,W-22,168);
    var cd1=wpn.a1CD?player.a1CD/wpn.a1CD:0;
    var cd2=wpn.a2CD?player.a2CD/wpn.a2CD:0;
    var cdD=0;
    if(wpn.dashCD)cdD=player.defCD/wpn.dashCD;
    else if(wpn.defCD)cdD=player.shieldCDTimer/wpn.defCD;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W-22-188,190,188,6);
    ctx.fillStyle='#ff6644';ctx.fillRect(W-22-188,190,188*cd1,6);
    ctx.fillStyle='#ffcc44';ctx.fillRect(W-22-188,198,188*cd2,6);
    ctx.fillStyle='#44ddff';ctx.fillRect(W-22-188,206,188*cdD,6);
    if(currentWeaponId==='dualBlades'){
        var eX=14,eY=250;
        ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(eX-3,eY-3,190,24);
        var eP=ultEnergy/wpn.ultMax;
        ctx.fillStyle='#3a1a1a';ctx.fillRect(eX,eY,184,18);
        var g=ctx.createLinearGradient(eX,0,eX+184,0);
        g.addColorStop(0,'#ff2266');g.addColorStop(1,'#ffcc44');
        ctx.fillStyle=g;ctx.fillRect(eX,eY,184*eP,18);
        ctx.strokeStyle=ultEnergy>=wpn.ultMax?'#ffdd44':'#8899bb';
        ctx.lineWidth=2;ctx.strokeRect(eX,eY,184,18);
        ctx.font='bold 12px "Courier New",monospace';
        ctx.textBaseline='middle';
        if(ultEnergy>=wpn.ultMax){
            var bl2=Math.floor(Date.now()/200)%2===0;
            ctx.fillStyle=bl2?'#ffdd44':'#ffffff';
            ctx.fillText('⭐ 按 I 释放 · '+wpn.ultName,eX+6,eY+9);
        }else{
            ctx.fillStyle='#ffffff';
            ctx.fillText('大招 '+ultEnergy+' / '+wpn.ultMax,eX+6,eY+9);
        }
        ctx.textBaseline='top';
    }
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-154,14,140,40);
    ctx.fillStyle='#f7edb0';ctx.font='bold 24px "Courier New",monospace';
    ctx.textBaseline='middle';
    ctx.fillText(String(score).padStart(5,'0'),W-22,30);
    ctx.font='11px "Courier New",monospace';ctx.fillStyle='#8899bb';
    ctx.fillText('SCORE',W-22,50);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-154,62,140,26);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Courier New",monospace';
    ctx.textBaseline='top';
    ctx.fillText('🪙 '+coins,W-22,68);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-234,94,220,56);
    if(menuMode==='mainline'){
        var stage=MAIN_STAGES[currentStage];
        ctx.fillStyle='#7bff9b';ctx.font='bold 15px "Courier New",monospace';
        ctx.fillText('主线 · '+stage.name,W-22,100);
        ctx.fillStyle='#c0d0e8';ctx.font='12px "Courier New",monospace';
        if(bossActive){
            ctx.fillStyle='#ff8888';
            ctx.fillText('⚠ BOSS 战',W-22,122);
        }else{
            ctx.fillText('进度 '+Math.min(stageKills,stage.quota)+' / '+stage.quota,W-22,122);
        }
    }else{
        ctx.fillStyle='#ffcc44';ctx.font='bold 15px "Courier New",monospace';
        ctx.fillText('无尽 · '+curDiff.name,W-22,100);
        var remain=Math.max(0,ENDLESS_INTERVAL-endlessBossTimer);
        var rS=Math.floor(remain/60);
        var mm=String(Math.floor(rS/60)).padStart(2,'0');
        var ss=String(rS%60).padStart(2,'0');
        ctx.fillStyle='#ff8888';ctx.font='12px "Courier New",monospace';
        if(bossActive)ctx.fillText('⚠ BOSS 战！',W-22,122);
        else ctx.fillText('下个BOSS: '+mm+':'+ss,W-22,122);
    }
    ctx.textAlign='center';ctx.font='12px "Courier New",monospace';
    ctx.fillStyle='rgba(180,200,230,0.5)';
    ctx.fillText('按 H 查看键位',W/2,H-22);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawGameOver(){
    ctx.fillStyle='#0b0d14';ctx.globalAlpha=0.75;
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 48px "Courier New",monospace';ctx.fillStyle='#f2a2a2';
    ctx.shadowColor='#000';ctx.shadowBlur=20;
    ctx.fillText('💀 任务失败',W/2,130);ctx.shadowBlur=0;
    if(menuMode==='mainline'){
        var bi=Math.max(0,currentStage-1);
        var bs=MAIN_STAGES[bi];
        ctx.font='22px "Courier New",monospace';ctx.fillStyle='#ffd700';
        ctx.fillText('将从「'+bs.name+'」重新开始',W/2,200);
    }else{
        ctx.font='26px "Courier New",monospace';ctx.fillStyle='#f7edb0';
        ctx.fillText('最终得分: '+score,W/2,210);
    }
    ctx.font='20px "Courier New",monospace';ctx.fillStyle='#d0d8e8';
    ctx.fillText('按 ENTER 重新开始   |   ESC 返回菜单',W/2,330);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawGameWin(){
    var t=Date.now()*0.001;
    ctx.fillStyle='#0b0d14';ctx.globalAlpha=0.9;
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    var glow=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,400);
    glow.addColorStop(0,'rgba(255,215,0,'+(0.15+Math.sin(t*2)*0.05)+')');
    glow.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    for(var i=0;i<20;i++){
        var px=(i*137+t*60)%W,py=(i*89+t*30)%H;
        ctx.fillStyle='rgba(255,220,100,'+(0.3+Math.sin(t*3+i)*0.2)+')';
        ctx.fillRect(px,py,2,2);
    }
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 60px "Courier New",monospace';
    ctx.shadowColor='#ffd700';ctx.shadowBlur=30;ctx.fillStyle='#ffed4a';
    ctx.fillText('🏆 任务完成',W/2,130);ctx.shadowBlur=0;
    ctx.font='20px "Courier New",monospace';ctx.fillStyle='#c0d0e8';
    ctx.fillText('你成功管控了"合金"药剂泄露事件',W/2,200);
    ctx.font='16px "Courier New",monospace';ctx.fillStyle='#88ddbb';
    ctx.fillText('森林 · 雪山 · 兵工厂 —— 全部通关',W/2,230);
    ctx.font='28px "Courier New",monospace';ctx.fillStyle='#f7edb0';
    ctx.fillText('最终得分: '+score,W/2,290);
    ctx.font='20px "Courier New",monospace';ctx.fillStyle='#d0d8e8';
    ctx.fillText('按 ENTER 重新挑战   |   ESC 返回菜单',W/2,400);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

/* ================= 主循环 ================= */
function loop(ts){
    var dt=lastTime===0?1/60:(ts-lastTime)/1000;
    lastTime=ts;
    acc+=dt;
    var steps=0;
    while(acc>=FIXED_DT&&steps<3){
        fixedUpdate();
        acc-=FIXED_DT;
        steps++;
    }
    keysPressed.KeyK=false;
    keysPressed.KeyI=false;
    if(acc>0.1)acc=0.1;
    draw();
    requestAnimationFrame(loop);
}

/* ================= 事件 ================= */
function skipLogo(){if(!logoComplete)logoComplete=true;}
window.addEventListener('keydown',function(e){
    if(!logoComplete){skipLogo();return;}
    var k=e.key;
    if(k==='h'||k==='H'){e.preventDefault();keyHelpOpen=!keyHelpOpen;return;}
    if(keyHelpOpen){if(k==='Escape'){e.preventDefault();keyHelpOpen=false;return;}return;}
    if(weaponSelOpen){
        var ids=Object.keys(WEAPONS);
        if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();weaponSelIdx=(weaponSelIdx-1+ids.length)%ids.length;return;}
        if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();weaponSelIdx=(weaponSelIdx+1)%ids.length;return;}
        if(k==='Enter'){e.preventDefault();currentWeaponId=ids[weaponSelIdx];saveWeapon();weaponSelOpen=false;return;}
        if(k==='Escape'){e.preventDefault();weaponSelOpen=false;return;}
        return;
    }
    if(endlessShopOpen){
        if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();endlessShopSel=(endlessShopSel-1+ITEM_ORDER.length+1)%(ITEM_ORDER.length+1);return;}
        if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();endlessShopSel=(endlessShopSel+1)%(ITEM_ORDER.length+1);return;}
        if(k==='Enter'){
            e.preventDefault();
            if(endlessShopSel===ITEM_ORDER.length){
                endlessShopOpen=false;gamePaused=false;bossCleared=false;boss=null;endlessBossTimer=0;
                playMusic(curDiff===DIFF.EASY?'bgmEasy':curDiff===DIFF.HARD?'bgmHard':'bgmMed');
            }else{
                var id=ITEM_ORDER[endlessShopSel];
                var item=ITEMS[id];
                if(coins>=item.price){
                    if(addItem(id)){coins-=item.price;saveCoins();}
                    else alert('无法购买：道具栏已满或该道具已达携带上限！');
                }else alert('金币不足！');
            }
            return;
        }
        return;
    }
    if(shopOpen){
        if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();shopSel=(shopSel-1+ITEM_ORDER.length)%ITEM_ORDER.length;return;}
        if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();shopSel=(shopSel+1)%ITEM_ORDER.length;return;}
        if(k==='Enter'){
            e.preventDefault();
            var id2=ITEM_ORDER[shopSel];
            var item2=ITEMS[id2];
            if(coins>=item2.price){
                if(addItem(id2)){coins-=item2.price;saveCoins();}
                else alert('无法购买：道具栏已满或该道具已达携带上限！');
            }else alert('金币不足！');
            return;
        }
        if(k==='Tab'||k==='Escape'){e.preventDefault();shopOpen=false;return;}
        return;
    }
    if(story){
        if(k==='Enter'){e.preventDefault();advanceStory();}
        if(k==='p'||k==='P'){e.preventDefault();skipStory();}
        return;
    }
    if(!gameStarted){
        if(k==='Tab'){e.preventDefault();shopOpen=true;shopSel=0;return;}
        if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();menuSel=(menuSel-1+3)%3;return;}
        if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();menuSel=(menuSel+1)%3;return;}
        if(k==='Enter'){
            e.preventDefault();
            if(menuSel===0)startMainline();
            else if(menuSel===1)startEndless();
            else{weaponSelOpen=true;weaponSelIdx=Object.keys(WEAPONS).indexOf(currentWeaponId);}
            return;
        }
        if(k==='1'&&menuSel===1){e.preventDefault();selDiff=DIFF.EASY;return;}
        if(k==='2'&&menuSel===1){e.preventDefault();selDiff=DIFF.MEDIUM;return;}
        if(k==='3'&&menuSel===1){e.preventDefault();selDiff=DIFF.HARD;return;}
        if(k==='1'&&menuSel===0){e.preventDefault();startMainline();return;}
        return;
    }
    if(k===' '){e.preventDefault();keys.Space=true;return;}
    if(k==='s'||k==='S'){e.preventDefault();keys.KeyS=true;return;}
    if(k==='w'||k==='W'){e.preventDefault();keys.KeyW=true;return;}
    if(k==='j'||k==='J'){e.preventDefault();keys.KeyJ=true;return;}
    if(k==='k'||k==='K'){if(!keys.KeyK)keysPressed.KeyK=true;e.preventDefault();keys.KeyK=true;return;}
    if(k==='l'||k==='L'){e.preventDefault();keys.KeyL=true;return;}
    if(k==='a'||k==='A'){e.preventDefault();keys.KeyA=true;return;}
    if(k==='d'||k==='D'){e.preventDefault();keys.KeyD=true;return;}
    if(k==='i'||k==='I'){if(!keys.KeyI)keysPressed.KeyI=true;e.preventDefault();keys.KeyI=true;return;}
    if(k==='r'||k==='R'){e.preventDefault();if(inventory.length>0)currentItemSlot=(currentItemSlot+1)%inventory.length;return;}
    if(k==='Escape'){
        e.preventDefault();
        if(gameOver||gameWin){returnMenu();}
        else if(!gameOver&&!gamePaused){
            if(confirm('确定要返回主菜单吗？当前进度将丢失。'))returnMenu();
        }
        return;
    }
    if(k==='Enter'){
        e.preventDefault();
        if(gameOver){
            if(menuMode==='mainline'){
                var bi=Math.max(0,currentStage-1);
                saveProgress(bi);startMainlineFrom(bi);
            }else startEndless();
        }else if(gameWin){
            saveProgress(0);startMainlineFrom(0);
        }
        return;
    }
});
window.addEventListener('keyup',function(e){
    var k=e.key;
    if(k===' '){e.preventDefault();keys.Space=false;return;}
    if(k==='s'||k==='S'){e.preventDefault();keys.KeyS=false;return;}
    if(k==='w'||k==='W'){e.preventDefault();keys.KeyW=false;return;}
    if(k==='j'||k==='J'){e.preventDefault();keys.KeyJ=false;return;}
    if(k==='k'||k==='K'){e.preventDefault();keys.KeyK=false;return;}
    if(k==='l'||k==='L'){e.preventDefault();keys.KeyL=false;return;}
    if(k==='a'||k==='A'){e.preventDefault();keys.KeyA=false;return;}
    if(k==='d'||k==='D'){e.preventDefault();keys.KeyD=false;return;}
    if(k==='i'||k==='I'){e.preventDefault();keys.KeyI=false;return;}
    if(k==='Escape'||k==='Enter'){e.preventDefault();return;}
});
canvas.addEventListener('click',function(){if(!logoComplete)skipLogo();});
canvas.addEventListener('touchstart',function(){if(!logoComplete)skipLogo();});
window.addEventListener('contextmenu',function(e){e.preventDefault();});
document.getElementById('restartBtn').addEventListener('click',function(){
    if(story)return;
    if(gameOver&&score>0&&!hasRecorded){addScore(score);hasRecorded=true;}
    if(menuMode==='mainline'){var bi=Math.max(0,currentStage-1);saveProgress(bi);startMainlineFrom(bi);}
    else startEndless();
});

/* ================= 初始化 ================= */
loadCoins();
loadWeapon();
resetEntities();
gameStarted=false;gameOver=false;gameWin=false;
menuMode='menu';menuSel=0;
inventory=[];currentItemSlot=0;
worldStarTimer=0;bgKey='';
bgmEasy.load();bgmMed.load();bgmHard.load();
requestAnimationFrame(loop);
window.addEventListener('beforeunload',function(){saveCoins();stopMusic();});
})();
</script>
