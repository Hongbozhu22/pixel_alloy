var audioCtx=null;
function getAC(){
    if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
}
function sHurt(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter(),lfo=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(220,n);o.frequency.linearRampToValueAtTime(140,n+0.18);o.frequency.linearRampToValueAtTime(180,n+0.32);
    lfo.frequency.value=16;lg.gain.value=22;lfo.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.setValueAtTime(1400,n);f.frequency.linearRampToValueAtTime(600,n+0.35);
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(0.5,n+0.015);g.gain.exponentialRampToValueAtTime(0.001,n+0.42);
    o.connect(f);f.connect(g);g.connect(ac.destination);o.start(n);lfo.start(n);o.stop(n+0.45);lfo.stop(n+0.45);
    var o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(110,n);o2.frequency.linearRampToValueAtTime(70,n+0.3);
    g2.gain.setValueAtTime(0,n);g2.gain.linearRampToValueAtTime(0.28,n+0.02);g2.gain.exponentialRampToValueAtTime(0.001,n+0.4);
    o2.connect(g2);g2.connect(ac.destination);o2.start(n);o2.stop(n+0.45);
}
function sMelee(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(800,n);o.frequency.exponentialRampToValueAtTime(300,n+0.08);
    g.gain.setValueAtTime(0.15,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.12);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.14);
}
function sHeavy(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(400,n);o.frequency.exponentialRampToValueAtTime(120,n+0.2);
    g.gain.setValueAtTime(0.35,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.25);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.28);
    var o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(100,n);o2.frequency.exponentialRampToValueAtTime(40,n+0.15);
    g2.gain.setValueAtTime(0.3,n);g2.gain.exponentialRampToValueAtTime(0.001,n+0.2);
    o2.connect(g2);g2.connect(ac.destination);o2.start(n);o2.stop(n+0.22);
}
function sDash(){

    g.gain.setValueAtTime(0.2,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.2);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.22);
}
function sWave(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(1200,n);o.frequency.exponentialRampToValueAtTime(300,n+0.4);
    g.gain.setValueAtTime(0.35,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.45);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.5);
}
function sParry(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.setValueAtTime(1600,n);o.frequency.exponentialRampToValueAtTime(500,n+0.1);
    g.gain.setValueAtTime(0.35,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.15);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.18);
    var o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='sawtooth';o2.frequency.setValueAtTime(2400,n);o2.frequency.exponentialRampToValueAtTime(800,n+0.2);
    g2.gain.setValueAtTime(0.2,n);g2.gain.exponentialRampToValueAtTime(0.001,n+0.25);
    o2.connect(g2);g2.connect(ac.destination);o2.start(n);o2.stop(n+0.28);
}
function sBoss(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    for(var i=0;i<3;i++){
        var o=ac.createOscillator(),g=ac.createGain();
        o.type='square';o.frequency.setValueAtTime(440-i*80,n+i*0.1);
        o.frequency.exponentialRampToValueAtTime(110,n+i*0.1+0.3);
        g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.2,n+i*0.1+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.35);
        o.connect(g);g.connect(ac.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.4);
    }
}
function sIce(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;

    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.22);
}
function sUlt(){
    var ac=getAC();if(!ac)return;var n=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.exponentialRampToValueAtTime(1200,n+0.4);
    g.gain.setValueAtTime(0.3,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.55);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+0.6);
    setTimeout(function(){
        if(!audioCtx)return;var t2=audioCtx.currentTime;
        var o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
        o2.type='square';o2.frequency.setValueAtTime(800,t2);o2.frequency.exponentialRampToValueAtTime(200,t2+0.3);
        g2.gain.setValueAtTime(0.4,t2);g2.gain.exponentialRampToValueAtTime(0.001,t2+0.4);
        o2.connect(g2);g2.connect(audioCtx.destination);o2.start(t2);o2.stop(t2+0.45);
    },650);
}

/* ================= 图片绘制辅助 ================= */
function drawImgCover(img,x,y,w,h){
    var iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    if(!iw||!ih)return;
    var sc=Math.max(w/iw,h/ih),dw=iw*sc,dh=ih*sc;
    var dx=x+(w-dw)/2,dy=y+(h-dh)/2;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();
}
function drawPortrait(img,x,y,size,accent){
    var cx=x+size/2,cy=y+size/2,r=size/2-4;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    var iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    var sc=Math.max(size/iw,size/ih),dw=iw*sc,dh=ih*sc;
    ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
    var vig=ctx.createRadialGradient(cx,cy,size*0.28,cx,cy,size*0.55);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(10,15,25,0.55)');
    ctx.fillStyle=vig;ctx.fillRect(x,y,size,size);
    ctx.globalCompositeOperation='overlay';
    for(var i=0;i<size;i+=3){ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(x,y+i,size,1);}
    ctx.globalCompositeOperation='source-over';ctx.restore();
    ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cx,cy,r+1,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=accent;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,r-3,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=accent;
    var co=8,of=4;
    ctx.fillRect(x+of,y+of,co,3);ctx.fillRect(x+of,y+of,3,co);
    ctx.fillRect(x+size-of-co,y+of,co,3);ctx.fillRect(x+size-of-3,y+of,3,co);
    ctx.fillRect(x+of,y+size-of-3,co,3);ctx.fillRect(x+of,y+size-of-co,3,co);
    ctx.fillRect(x+size-of-co,y+size-of-3,co,3);ctx.fillRect(x+size-of-3,y+size-of-co,3,co);
}
function drawMerchant(img,x,y,w,h){
    var iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    var sc=Math.max(w/iw,h/ih),dw=iw*sc,dh=ih*sc;
    var dx=x+(w-dw)/2,dy=y+(h-dh)/2;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    var bg=ctx.createLinearGradient(x,y,x,y+h);
    bg.addColorStop(0,'#1a0a12');bg.addColorStop(1,'#0a0510');
    ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);
    ctx.drawImage(img,dx,dy,dw,dh);
    var fv=ctx.createLinearGradient(x,y+h-80,x,y+h);
    fv.addColorStop(0,'rgba(10,5,20,0)');fv.addColorStop(1,'rgba(10,5,20,0.9)');
    ctx.fillStyle=fv;ctx.fillRect(x,y+h-80,w,80);
    var vig=ctx.createRadialGradient(x+w/2,y+h/2,Math.min(w,h)*0.25,x+w/2,y+h/2,Math.max(w,h)*0.75);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(10,5,20,0.7)');
    ctx.fillStyle=vig;ctx.fillRect(x,y,w,h);
    ctx.globalCompositeOperation='overlay';
    for(var i=0;i<h;i+=3){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(x,y+i,w,1);}
    ctx.globalCompositeOperation='source-over';ctx.restore();
    ctx.strokeStyle='#0a0510';ctx.lineWidth=5;
    ctx.strokeRect(x-1,y-1,w+2,h+2);
    ctx.strokeStyle='#ff2266';ctx.lineWidth=3;
    ctx.strokeRect(x+1,y+1,w-2,h-2);
    ctx.shadowColor='#ff2266';ctx.shadowBlur=15;
    ctx.strokeRect(x+1,y+1,w-2,h-2);ctx.shadowBlur=0;
    ctx.fillStyle='#ff66aa';
    var co=12,of=4;
    ctx.fillRect(x+of,y+of,co,3);ctx.fillRect(x+of,y+of,3,co);
    ctx.fillRect(x+w-of-co,y+of,co,3);ctx.fillRect(x+w-of-3,y+of,3,co);
    ctx.fillRect(x+of,y+h-of-3,co,3);ctx.fillRect(x+of,y+h-of-co,3,co);
    ctx.fillRect(x+w-of-co,y+h-of-3,co,3);ctx.fillRect(x+w-of-3,y+h-of-co,3,co);
}

function spawnPart(o){
    if(particles.length>=MAX_PARTS)return;
    particles.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g!==undefined?o.g:0.18,
        life:o.life||30,maxLife:o.life||30,size:o.size||3,color:o.color||'#fff',
        shape:o.shape||'square',fade:o.fade!==false,shrink:o.shrink!==false,glow:o.glow||false});
}
function updParts(){
    for(var i=particles.length-1;i>=0;i--){
        var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.97;p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParts(){
    for(var i=0;i<particles.length;i++){
        var p=particles[i];var t=p.life/p.maxLife;
        ctx.globalAlpha=p.fade?Math.max(0,Math.min(1,t*1.4)):1;
        if(p.glow){ctx.shadowColor=p.color;ctx.shadowBlur=8;}
        ctx.fillStyle=p.color;
        var s=p.shrink?p.size*(0.35+t*0.65):p.size;
        if(p.shape==='circle'){ctx.beginPath();ctx.arc(p.x,p.y,s*0.5,0,Math.PI*2);ctx.fill();}
        else ctx.fillRect(p.x-s*0.5,p.y-s*0.5,s,s);
        ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
}

function addItem(id){
    for(var i=0;i<inventory.length;i++){
        if(inventory[i].id===id){
            if(inventory[i].count>=ITEMS[id].maxCarry)return false;
            inventory[i].count++;return true;
        }
    }
    if(inventory.length>=2)return false;
    inventory.push({id:id,count:1});return true;
}
function useItem(){
    if(inventory.length===0)return;
    if(currentItemSlot>=inventory.length)currentItemSlot=0;
    var s=inventory[currentItemSlot];
    if(!s||s.count<=0)return;
    var used=false;
    if(s.id==='heal'){if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+50);used=true;}}
    else if(s.id==='invincible'){player.itemInv=180;used=true;}
    else if(s.id==='bomb'){var bx=player.facingRight?player.x+player.w+40:player.x-40;boomBig(bx,player.y+player.h/2);used=true;}
    else if(s.id==='star'){worldStarTimer=120;used=true;}
    if(used){s.count--;if(s.count<=0){inventory.splice(currentItemSlot,1);if(currentItemSlot>=inventory.length)currentItemSlot=Math.max(0,inventory.length-1);}}
}
function boomBig(x,y){

    spawnBoom(x,y,160);shakeAmt=Math.max(shakeAmt,8);
    for(var i=enemies.length-1;i>=0;i--){
        var e=enemies[i];var d=dist({x:x,y:y},{x:e.x+e.w/2,y:e.y+e.h/2});
        if(d<160){e.hp-=300;if(e.hp<=0){onKill(e);enemies.splice(i,1);if(e.isFlyer)flyerRespawnT=getStageCfg().flyerDelay;}}
    }
    if(bossActive&&boss&&bossIntroT===0){
        var bx=boss.x+boss.w/2,by=boss.y+boss.h/2;
        var d2=Math.hypot(bx-x,by-y);

    }
}

function updateMelee(){
    if(player.meleeTimer<=0)return;
    player.meleeTimer--;

        var cbox={x:dir>0?player.x-10:player.x-cr,y:player.y-15,w:player.w+cr+10,h:player.h+30};
        for(var bi=bullets.length-1;bi>=0;bi--){
            var b=bullets[bi];
            if(b.enemy&&coll(cbox,b)){spawnHit(b.x,b.y,true);bullets.splice(bi,1);}
        }
        for(var si=snowIceBalls.length-1;si>=0;si--){
            var ice=snowIceBalls[si];
            if(ice.exploded)continue;
            var ib={x:ice.x-ice.r,y:ice.y-ice.r,w:ice.r*2,h:ice.r*2};
            if(coll(cbox,ib)){ice.exploded=true;ice.t=0;spawnBoom(ice.x,ice.y,50);}
        }
        var range=player.meleeType==='heavy'?50:38;
        var mbox={x:dir>0?player.x+player.w:player.x-range,y:player.y-2,w:range,h:player.h+4};
        var dmg=player.meleeType==='heavy'?100:50;
        var kb=player.meleeType==='heavy'?25:8;
        for(var i=enemies.length-1;i>=0;i--){
            var e=enemies[i];
            if(player.meleeHits.indexOf(e)>=0)continue;
            if(coll(mbox,e)){
                e.hp-=dmg;e.x+=dir*kb;player.meleeHits.push(e);
                spawnHit(e.x+e.w/2,e.y+e.h/2,true);
                hitStop=player.meleeType==='heavy'?6:3;
                shakeAmt=Math.max(shakeAmt,player.meleeType==='heavy'?7:4);
                if(e.hp<=0){onKill(e);enemies.splice(i,1);if(e.isFlyer)flyerRespawnT=getStageCfg().flyerDelay;}
            }
        }
        if(bossActive&&boss&&bossIntroT===0&&player.meleeHits.indexOf(boss)<0){
            if(coll(mbox,boss)){
                boss.hp-=dmg;player.meleeHits.push(boss);
                spawnHit(boss.x+boss.w/2,boss.y+boss.h/2,true);
                hitStop=4;shakeAmt=Math.max(shakeAmt,4);
            }
        }
    }
    if(player.meleeTimer===0){player.isAttacking=false;player.meleeType=null;}
}

/* ================= 弹反 ================= */
function checkParry(){
    if(currentWeaponId!=='dualBlades'){parryWindow=0;return;}
    if(player.dashTimer>0||player.isAttacking)return;
    if(gameOver||gamePaused||!gameStarted||gameWin)return;
    var cx=player.x+player.w/2,cy=player.y+player.h/2;
    var range=42,close=false;
    for(var i=0;i<bullets.length;i++){
        var b=bullets[i];
        if(!b.enemy)continue;
        if(Math.hypot((b.x+b.w/2)-cx,(b.y+b.h/2)-cy)<range){close=true;break;}
    }
    if(!close){
        for(var j=0;j<snowIceBalls.length;j++){
            var ice=snowIceBalls[j];
            if(ice.exploded)continue;
            if(Math.hypot(ice.x-cx,ice.y-cy)<range+ice.r){close=true;break;}
        }
    }
    if(!close){
        for(var k=0;k<enemies.length;k++){
            var e=enemies[k];
            if(e.isFlyer)continue;
            if(Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<range+22){close=true;break;}
        }
    }
    if(close)parryWindow=PARRY_WINDOW_MAX;
}
function doParry(){
    parryWindow=0;parryFlash=18;player.invincible=35;
    var cx=player.x+player.w/2,cy=player.y+player.h/2;
    var target=null,best=Infinity;
    for(var i=0;i<enemies.length;i++){
        var e=enemies[i];
        var d=Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy);
        if(d<best){best=d;target=e;}
    }
    if(bossActive&&boss&&bossIntroT===0){
        var d2=Math.hypot(boss.x+boss.w/2-cx,boss.y+boss.h/2-cy);
        if(d2<best){best=d2;target=boss;}
    }
    for(var bi=bullets.length-1;bi>=0;bi--){
        var b=bullets[bi];
        if(b.enemy&&Math.hypot(b.x-cx,b.y-cy)<120){spawnHit(b.x,b.y,true);bullets.splice(bi,1);}
    }
    if(target){
        if(player.x+player.w/2<target.x+target.w/2){player.x=target.x-player.w-6;player.facingRight=true;}
        else{player.x=target.x+target.w+6;player.facingRight=false;}
        player.y=GROUND_Y-player.h;player.vx=0;
        target.hp-=150;
        spawnHit(target.x+target.w/2,target.y+target.h/2,true);
        if(ultEnergy<ULT_MAX)ultEnergy=Math.min(ULT_MAX,ultEnergy+2);
        hitStop=12;shakeAmt=Math.max(shakeAmt,12);
        try{sParry();}catch(e){}
        if(target!==boss&&target.hp<=0){
            onKill(target);
            var idx=enemies.indexOf(target);
            if(idx>=0)enemies.splice(idx,1);
        }
    }else{
        hitStop=6;shakeAmt=Math.max(shakeAmt,8);
        try{sParry();}catch(e){}
    }
    for(var p=0;p<20;p++){
        var ang=Math.random()*Math.PI*2,sp=3+Math.random()*4;
        spawnPart({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:0.1,life:20,size:3,color:'#ffffff',glow:true});
    }
}

/* ================= 大招 ================= */
function triggerUlt(){
    ultActive=true;ultTimer=0;ultPhase='charge';ultHits=[];ultStartX=player.x;
    var w=getW();var dir=player.facingRight?1:-1;
    ultTargetX=player.x+dir*w.ultDashDist;
    ultTargetX=Math.max(20,Math.min(MAP_WIDTH-player.w-20,ultTargetX));
    ultEnergy=0;ultFlash=25;
    player.invincible=w.ultDuration+30;
    player.isAttacking=false;
    try{sUlt();}catch(e){}
}
function updateUlt(){
    if(!ultActive)return;
    ultTimer++;
    var w=getW();var t=ultTimer;
    if(t<15){ultPhase='charge';player.vx=0;}
    else if(t<w.ultDashEnd){
        ultPhase='dash';
        var prog=(t-15)/(w.ultDashEnd-15);
        player.x=ultStartX+(ultTargetX-ultStartX)*prog;
        player.vx=0;player.vy=0;player.y=GROUND_Y-player.h;
        if(t%5===0){
            var hb={x:player.x-25,y:player.y-25,w:player.w+50,h:player.h+50};
            for(var i=0;i<enemies.length;i++){
                var e=enemies[i];
                if(ultHits.indexOf(e)>=0)continue;
                if(coll(hb,e)){ultHits.push(e);e.hp-=w.ultDamage;spawnHit(e.x+e.w/2,e.y+e.h/2,true);}
            }
            if(bossActive&&boss&&bossIntroT===0&&ultHits.indexOf(boss)<0){
                if(coll(hb,boss)){ultHits.push(boss);boss.hp-=w.ultDamage;spawnHit(boss.x+boss.w/2,boss.y+boss.h/2,true);}
            }
        }
    } else if(t<w.ultDuration){
        ultPhase='end';
        if(t===w.ultDashEnd){
            var dmg=w.ultDamage;
            for(var i=enemies.length-1;i>=0;i--){
                var e=enemies[i];
                var dx=(e.x+e.w/2)-(player.x+player.w/2);
                var dy=(e.y+e.h/2)-(player.y+player.h/2);
                if(Math.hypot(dx,dy)<320){
                    if(ultHits.indexOf(e)<0){ultHits.push(e);e.hp-=dmg;spawnHit(e.x+e.w/2,e.y+e.h/2,true);}
                    if(e.hp<=0){onKill(e);enemies.splice(i,1);}
                }
            }
            if(bossActive&&boss&&bossIntroT===0&&ultHits.indexOf(boss)<0){
                var dx2=(boss.x+boss.w/2)-(player.x+player.w/2);
                var dy2=(boss.y+boss.h/2)-(player.y+player.h/2);
                if(Math.hypot(dx2,dy2)<380){ultHits.push(boss);boss.hp-=dmg;spawnHit(boss.x+boss.w/2,boss.y+boss.h/2,true);}
            }
            for(var bi=bullets.length-1;bi>=0;bi--){
                if(bullets[bi].enemy)bullets.splice(bi,1);
            }
            shakeAmt=Math.max(shakeAmt,18);
            hitStop=Math.max(hitStop,15);
            try{sBoss();}catch(e){}
        }
    } else {
        ultActive=false;ultPhase='idle';
    }
}

function spawnGround(){
    var cfg=getStageCfg();
    if(groundCount()>=cfg.maxGround)return;
    var pr=playerRegion();
    var x,tr,isCharger;
    var cc=cfg.chargerChance||0.35;
    if(pr===1){
        var side=Math.random()>0.5?1:-1;
        if(side>0){x=MAP_WIDTH-ENEMY_W-20-Math.random()*30;tr=2;}
        else{x=20+Math.random()*30;tr=0;}
        isCharger=Math.random()<cc;
    }else{
        var adj=adjRegions(pr);var nadj=nonAdjRegions(pr);
        isCharger=Math.random()<cc;
        if(isCharger){
            tr=adj.length>0?adj[Math.floor(Math.random()*adj.length)]:1;
            var rc=(tr+0.5)*REGION_W;
            x=rc+(Math.random()-0.5)*104;
            x=Math.max(ENEMY_W+10,Math.min(MAP_WIDTH-ENEMY_W-10,x));
        }else{
            if(nadj.length>0)tr=nadj[Math.floor(Math.random()*nadj.length)];
            else tr=pr===0?2:0;
            var rs=tr*REGION_W;var re=(tr+1)*REGION_W;
            var side2=Math.random()>0.5?1:-1;
            if(side2>0)x=re-30-Math.random()*40;
            else x=rs+30+Math.random()*40;
            x=Math.max(ENEMY_W+10,Math.min(MAP_WIDTH-ENEMY_W-10,x));
        }
    }
    var y=GROUND_Y-ENEMY_H+2;
    enemies.push(makeGroundEnemy(x,y,isCharger));
}

function onKill(e){

    bossActive=true;bossCleared=false;bossIntroT=BOSS_INTRO_FRAMES;bossWarnT=0;bossPending=null;
    bullets=[];enemies=[];grenades=[];explosions=[];forestVines=[];snowIceBalls=[];factoryMissiles=[];
    player.x=cameraX+20;player.y=GROUND_Y-player.h;player.vx=0;player.vy=0;player.invincible=90;
    if(stage.id==='forest'){forestIdleT=0;forestRegen=0;}
    else if(stage.id==='snow'){snowStillTimer=0;snowSlow=false;}
    else if(stage.id==='factory'){fChargeActive=false;fChargePos=0;fChargeDir=-1;fChargeT=0;fBombState=0;fBombIdx=0;fBombT=0;}
}
function startBossWarn(type){
    bossPending=type;bossWarnT=WARN_FRAMES;
    if(boss){
        boss.attackAnim=60;
        if(type==='vine'){boss.attackTargetX=Math.max(80,Math.min(MAP_WIDTH-80,player.x+player.w/2+(Math.random()-0.5)*120));}
        else if(type==='snow'){boss.attackTargetX=player.x+player.w/2;}
    }
}
function execBossAttack(type){
    if(type==='vine'){
        var tx=boss.attackTargetX!==null?boss.attackTargetX:(player.x+player.w/2);
        forestVines.push({startX:cameraX+W+30,startY:-40,targetX:tx,targetY:GROUND_Y,t:0,flightDur:22,restDur:28,hit:false});
        boss.attackAnim=40;
    }else if(type==='snow'){
        var sx=boss.x+boss.w*0.3,sy=boss.y+boss.h*0.4;
        var dx=(player.x+player.w/2)-sx,dy=(player.y+player.h/2)-sy;
        var d=Math.hypot(dx,dy)||1;
        var speed=5.5;
        snowIceBalls.push({x:sx,y:sy,vx:dx/d*speed,vy:dy/d*speed,r:26,rot:0,t:0,life:180,exploded:false,trailTimer:0});
        boss.attackAnim=40;
    }else if(type==='charge'){
        fChargeActive=true;fChargePos=W-F_CHARGE_W/2-10;fChargeDir=-1;fChargeT=0;
        boss.attackAnim=40;
    }else if(type==='bomb'){
        fBombState=1;fBombIdx=0;fBombT=0;
        var targets=[];
        for(var i=1;i<=3;i++){
            var bx=boss.x-80-i*150;
            if(bx>40)targets.push(bx);
        }
        factoryMissiles=[];
        for(var j=0;j<targets.length;j++){
            factoryMissiles.push({targetX:targets[j],targetY:GROUND_Y-20,
                x:targets[j]+120,y:-80,startDelay:j*30,t:0,flightDur:55,state:'waiting',trailTimer:0});
        }
        boss.attackAnim=40;
    }
}
function updateBoss(){
    if(!bossActive||!boss)return;
    if(boss.attackAnim>0)boss.attackAnim--;
    if(bossIntroT>0){bossIntroT--;return;}
    var stage=MAIN_STAGES[boss.stageIndex];
    boss.attackTimer++;boss.minionTimer++;
    if(boss.minionTimer>=boss.minionInterval){
        boss.minionTimer=0;
        if(Math.random()<0.7){if(groundCount()<stage.maxGround+2)spawnGroundFromBoss();}
        if(Math.random()<0.5&&flyerCount()<stage.maxFlyers+1)spawnFlyerFromBoss();
    }
    if(bossWarnT>0){
        bossWarnT--;
        if(bossWarnT===0&&bossPending){execBossAttack(bossPending);bossPending=null;}
        return;
    }
    if(stage.id==='forest')updateForestBoss();
    else if(stage.id==='snow')updateSnowBoss();
    else if(stage.id==='factory')updateFactoryBoss();
    if(boss.hp<=0){
        boss.hp=0;bossActive=false;bossCleared=true;
        score+=500;coins+=getBossCoins();saveCoins();
        spawnBoom(boss.x+boss.w/2,boss.y+boss.h/2,200);
        try{sBoss();}catch(e){}
        if(menuMode==='mainline'){
            if(stage.id==='forest'){
                startStory(sForestClear(),function(){
                    currentStage=1;saveProgress(1);
                    player.hp=Math.min(player.maxHp,player.hp+50);player.grenades=Math.min(player.maxGrenades,player.grenades+5);
                    startStory(sSnowIntro(),function(){
                        stageKills=0;resetEntities();spawnInitial();bgKey='';
                        stageTransition=STAGE_TRANS_FRAMES;stageTransType='enter';
                        playMusic(MAIN_STAGES[currentStage].bgm);
                    });
                });
            }else if(stage.id==='snow'){
                startStory(sSnowClear(),function(){
                    currentStage=2;saveProgress(2);
                    player.hp=Math.min(player.maxHp,player.hp+50);player.grenades=Math.min(player.maxGrenades,player.grenades+5);
                    startStory(sFacIntro(),function(){
                        stageKills=0;resetEntities();spawnInitial();bgKey='';
                        stageTransition=STAGE_TRANS_FRAMES;stageTransType='enter';
                        playMusic(MAIN_STAGES[currentStage].bgm);
                    });
                });
            }else{
                startStory(sFacClear(),function(){
                    if(!hasRecorded){addScore(score);hasRecorded=true;}
                    saveProgress(0);gameWin=true;pauseMusic();
                });
            }
        }else{
            endlessShopOpen=true;endlessShopSel=0;
            endlessShopDialog=WISE_LINES[Math.floor(Math.random()*WISE_LINES.length)];
            gamePaused=true;endlessBossTimer=0;pauseMusic();
        }
    }
}
function updateForestBoss(){
    forestIdleT++;
    if(forestIdleT>=180){
        forestRegen++;
        if(forestRegen>=60){forestRegen=0;boss.hp=Math.min(boss.maxHp,boss.hp+50);}
    }
    var i=boss.hp<boss.maxHp/2?180:300;
    if(boss.attackTimer>=i){boss.attackTimer=0;startBossWarn('vine');forestIdleT=0;}
}
function updateSnowBoss(){
    if(boss.hp<boss.maxHp/2)snowSlow=true;
    if(boss.attackTimer>=240){boss.attackTimer=0;startBossWarn('snow');}
}
function updateFactoryBoss(){
    var half=boss.hp<boss.maxHp/2;
    if(!half){
        if(!fChargeActive&&boss.attackTimer>=240){boss.attackTimer=0;startBossWarn('charge');}
        if(fChargeActive){
            fChargeT++;fChargePos+=10*fChargeDir;
            if(fChargeDir===-1&&fChargePos<=cameraX+W/2-50)fChargeDir=1;
            else if(fChargeDir===1&&fChargePos>=cameraX+W-F_CHARGE_W/2-10)fChargeActive=false;
            var cl=fChargePos-F_CHARGE_W/2,cr=fChargePos+F_CHARGE_W/2;
            if(player.x+player.w>cl&&player.x<cr&&player.y+player.h>GROUND_Y-120)hurtPlayer(40);
        }
    }else{
        if(fBombState===0&&boss.attackTimer>=180){boss.attackTimer=0;startBossWarn('bomb');}
        if(fBombState===1){
            fBombT++;
            var allDone=true;
            for(var i=0;i<factoryMissiles.length;i++){if(factoryMissiles[i].state!=='done'){allDone=false;break;}}
            if(allDone&&fBombT>60){fBombState=0;factoryMissiles=[];}
        }
    }
}
function updateBossAttacks(){
    for(var i=forestVines.length-1;i>=0;i--){
        var v=forestVines[i];v.t++;
        if(v.t<=v.flightDur){}
        else if(!v.hit){
            v.hit=true;
            if(Math.abs(player.x+player.w/2-v.targetX)<60&&player.y+player.h>GROUND_Y-150)hurtPlayer(20);
            var colors=['#8B6B3D','#5a4020','#4a7a35','#6d9a45'];
            for(var k=0;k<20;k++){
                var ang=-Math.PI*0.8+Math.random()*Math.PI*0.6;
                var sp=1+Math.random()*3;
                spawnPart({x:v.targetX+(Math.random()-0.5)*20,y:GROUND_Y,
                    vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:0.28,
                    life:25+Math.floor(Math.random()*20),size:2+Math.random()*3,
                    color:colors[Math.floor(Math.random()*colors.length)]});
            }
        }
        if(v.t>=v.flightDur+v.restDur)forestVines.splice(i,1);
    }
    for(var i2=snowIceBalls.length-1;i2>=0;i2--){
        var b=snowIceBalls[i2];
        if(b.exploded){b.t++;if(b.t>20)snowIceBalls.splice(i2,1);continue;}
        b.x+=b.vx;b.y+=b.vy;b.rot+=0.15;b.t++;b.life--;b.trailTimer++;
        if(b.trailTimer>=2){
            b.trailTimer=0;
            for(var k2=0;k2<3;k2++){
                spawnPart({x:b.x+(Math.random()-0.5)*12,y:b.y+(Math.random()-0.5)*12,
                    vx:-b.vx*0.2+(Math.random()-0.5),vy:-b.vy*0.2+(Math.random()-0.5),
                    g:0.02,life:15+Math.floor(Math.random()*10),size:2+Math.random()*4,
                    color:['#ffffff','#c8e8ff','#88ddff'][Math.floor(Math.random()*3)],shape:'circle',glow:true});
            }
        }
        var hit=false;
        var pBox={x:player.x,y:player.y,w:player.w,h:player.h};
        var ib={x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2};
        if(coll(pBox,ib)){
            hurtPlayer(25);
            player.slowTimer=180;
            try{sIce();}catch(e){}
            hit=true;
        }
        if(b.y+b.r>=GROUND_Y||b.x<cameraX-40||b.x>cameraX+W+40||b.y<-40||b.life<=0)hit=true;
        if(hit){
            b.exploded=true;b.t=0;
            for(var k3=0;k3<24;k3++){
                var ang3=Math.random()*Math.PI*2;var sp3=1+Math.random()*3.5;
                spawnPart({x:b.x,y:b.y,vx:Math.cos(ang3)*sp3,vy:Math.sin(ang3)*sp3,
                    g:0.2,life:20+Math.floor(Math.random()*15),size:2+Math.random()*5,
                    color:['#ffffff','#c8e8ff','#88ddff','#aac8e0'][Math.floor(Math.random()*4)],shape:'circle',glow:true});
            }
        }
    }
    for(var i3=factoryMissiles.length-1;i3>=0;i3--){
        var m=factoryMissiles[i3];
        if(m.state==='waiting'){
            m.t++;
            if(m.t>=m.startDelay){m.state='flying';m.t=0;}
            continue;
        }
        if(m.state==='flying'){
            m.t++;
            var prog=Math.min(1,m.t/m.flightDur);
            m.x=(m.targetX+120)+(m.targetX-(m.targetX+120))*prog;
            m.y=-80+(m.targetY-(-80))*prog;
            if(m.t>=m.flightDur){
                m.state='exploding';m.t=0;
                var d2=Math.abs(player.x+player.w/2-m.targetX);
                if(d2<80&&player.y+player.h>GROUND_Y-100)hurtPlayer(30);
                explosions.push({x:m.targetX-40,y:GROUND_Y-60,w:80,h:80,timer:20,maxTimer:20,radius:80});
                spawnBoom(m.targetX,GROUND_Y-30,100);
                shakeAmt=Math.max(shakeAmt,5);
            }
        }
        if(m.state==='exploding'){m.t++;if(m.t>30)m.state='done';}
    }
}
function updateSnowEnv(){
    if(menuMode!=='mainline')return;
    if(MAIN_STAGES[currentStage].id!=='snow')return;
    if(story||stageTransition>0||!gameStarted||gameOver||gameWin)return;
    var moving=Math.abs(player.vx)>0.3||!player.onGround;
    if(moving){snowStillTimer=0;snowEnvCounter=0;}
    else{
        snowStillTimer++;
        if(snowStillTimer>=120){
            snowEnvCounter++;
            if(snowEnvCounter>=60){
                snowEnvCounter=0;
                if(player.itemInv===0&&player.invincible===0){
                    player.hp-=5;player.invincible=15;
                    for(var i=0;i<8;i++){
                        spawnPart({x:player.x+Math.random()*player.w,y:player.y+Math.random()*player.h,
                            vx:(Math.random()-0.5)*1.5,vy:-0.5-Math.random(),g:0.02,
                            life:20+Math.floor(Math.random()*15),size:2+Math.random()*2,
                            color:['#c8e8ff','#88ddff','#ffffff'][Math.floor(Math.random()*3)],shape:'circle',glow:true});
                    }
                    try{sHurt();}catch(e){}
                    if(player.hp<=0){player.hp=0;gameOver=true;pauseMusic();if(!hasRecorded){addScore(score);hasRecorded=true;}}
                }
            }
        }
    }
}

/* ================= 主更新 ================= */
function fixedUpdate(){
    var justK=keysPressed.KeyK;
    var justI=keysPressed.KeyI;
    keysPressed.KeyK=false;
    keysPressed.KeyI=false;

    updParts();

    if(hitStop>0){hitStop--;return;}

    if(ultActive){
        updateUlt();
        if(ultFlash>0)ultFlash--;
        if(parryFlash>0)parryFlash--;
        return;
    }

    updateBossAttacks();

    if(keyHelpOpen||weaponSelOpen)return;
    if(story)return;
    if(endlessShopOpen)return;

    if(stageTransition>0){
        stageTransition--;
        if(stageTransition===0&&stageTransType==='enter'){
            stageTransType=null;
            if(menuMode==='mainline'&&!bossActive&&!bossCleared){
                if(stageKills>=MAIN_STAGES[currentStage].quota)spawnBoss();
            }
        }
        return;
    }
    if(!gameStarted||gameOver||gamePaused||gameWin)return;

    if(menuMode==='endless'&&!bossActive&&!bossCleared){
        endlessBossTimer++;
        if(endlessBossTimer>=ENDLESS_INTERVAL){
            var r=Math.floor(Math.random()*MAIN_STAGES.length);
            spawnBoss(r);
            endlessBossTimer=0;
        }
    }

    updateSnowEnv();
    checkParry();
    if(parryWindow>0)parryWindow--;
    if(parryFlash>0)parryFlash--;

    if(worldStarTimer>0)worldStarTimer--;
    if(flyerRespawnT>0)flyerRespawnT--;
    if(player.grenadeCD>0)player.grenadeCD--;
    if(player.itemInv>0)player.itemInv--;
    if(player.throwTimer>0)player.throwTimer--;
    if(player.shootTimer>0)player.shootTimer--;
    if(player.slowTimer>0)player.slowTimer--;
    if(player.a1CD>0)player.a1CD--;
    if(player.a2CD>0)player.a2CD--;
    if(player.defCD>0)player.defCD--;

    if(currentWeaponId==='gun'){
        if(player.shieldOnCD){
            player.shieldCDTimer--;
            if(player.shieldCDTimer<=0){player.shieldOnCD=false;player.shieldCDTimer=0;}
        }
        if(keys.KeyL&&!player.shieldOnCD&&!gameOver){
            if(!player.shieldOn){player.shieldOn=true;player.shieldTimer=0;}
        }else{
            if(player.shieldOn){
                player.shieldOn=false;
                if(player.shieldTimer>0){player.shieldOnCD=true;player.shieldCDTimer=SHIELD_CD;}
            }
        }
        if(player.shieldOn){
            player.shieldTimer++;
            if(player.shieldTimer>=SHIELD_DUR){
                player.shieldOn=false;player.shieldOnCD=true;player.shieldCDTimer=SHIELD_CD;
            }
        }
    }else{
        player.shieldOn=false;
    }

    var wasCrouch=player.isCrouching;
    player.isCrouching=!!keys.KeyS&&player.onGround;
    if(player.isCrouching){player.h=player.crouchH;player.y=GROUND_Y-player.h;}
    else{
        if(wasCrouch){player.h=player.normalH;player.y=GROUND_Y-player.normalH;}
        else player.h=player.normalH;
    }

    if(player.dashTimer>0){
        player.dashTimer--;
        player.vx=player.dashDirX*getW().dashSpeed;player.vy=0;
        player.invincible=Math.max(player.invincible,2);
        if(player.dashTimer%2===0){
            player.dashAfterimages.push({x:player.x,y:player.y,life:15,maxLife:15});
        }
        for(var ei=0;ei<enemies.length;ei++){
            var e=enemies[ei];
            if(coll(player,e)){
                if(player.x+player.w/2<e.x+e.w/2)player.x=e.x-player.w-1;
                else player.x=e.x+e.w+1;
            }
        }
        if(bossActive&&boss&&bossIntroT===0&&coll(player,boss)){
            if(player.x+player.w/2<boss.x+boss.w/2)player.x=boss.x-player.w-1;
            else player.x=boss.x+boss.w+1;
        }
        if(player.dashTimer===0)player.dashEndBuffer=3;
    }
    if(player.dashEndBuffer>0){
        player.dashEndBuffer--;
        player.invincible=Math.max(player.invincible,2);
    }
    for(var ai=player.dashAfterimages.length-1;ai>=0;ai--){
        player.dashAfterimages[ai].life--;
        if(player.dashAfterimages[ai].life<=0)player.dashAfterimages.splice(ai,1);
    }

    if(justK&&currentWeaponId==='dualBlades'&&!gameOver&&!player.isAttacking&&player.dashTimer===0&&player.a2CD<=0){
        if(parryWindow>0)doParry();
        else meleeHeavy();
    }

    var locked=player.isAttacking&&currentWeaponId==='dualBlades';
    var moveX=0;
    if(player.dashTimer>0)moveX=0;
    else if(!locked){
        if(keys.KeyA){moveX=-1;player.facingRight=false;}
        if(keys.KeyD){moveX=1;player.facingRight=true;}
    }
    var speedMul=player.isCrouching?0.5:(player.shieldOn?0.8:1);
    if(player.slowTimer>0)speedMul*=0.8;
    if(moveX!==0){
        player.vx+=moveX*0.8*speedMul;
        var maxV=SP.pSpeed*speedMul;
        if(Math.abs(player.vx)>maxV)player.vx=maxV*moveX;
    }else{
        player.vx*=0.78;
        if(Math.abs(player.vx)<0.3)player.vx=0;
    }
    if(keys.Space&&player.onGround&&!player.isCrouching&&!locked){
        player.vy=SP.pJump;player.onGround=false;
        spawnDust(player.x+player.w/2,GROUND_Y,0,4);
    }
    player.shootingUp=!!keys.KeyW;

    var prevVy=player.vy;
    var wasGround=player.onGround;
    player.vy+=SP.pGrav;
    if(player.vy>SP.pMaxFall)player.vy=SP.pMaxFall;
    player.x+=player.vx;player.y+=player.vy;
    if(player.isCrouching){player.y=GROUND_Y-player.h;player.vy=0;player.onGround=true;}
    else if(player.y+player.h>=GROUND_Y){player.y=GROUND_Y-player.h;player.vy=0;player.onGround=true;}
    else player.onGround=false;
    if(player.x<0)player.x=0;
    if(player.x+player.w>MAP_WIDTH)player.x=MAP_WIDTH-player.w;
    if(!wasGround&&player.onGround&&prevVy>4)spawnDustBig(player.x+player.w/2,GROUND_Y);
    if(player.onGround&&!player.isCrouching&&Math.abs(player.vx)>1.2){
        var freq=0.15+Math.abs(player.vx)*0.06;
        if(Math.random()<freq)spawnDust(player.x+player.w/2-Math.sign(player.vx)*6,GROUND_Y,Math.sign(player.vx),1);
    }
    if(player.onGround&&Math.abs(player.vx)>0.3)player.walkPhase+=Math.abs(player.vx)*0.22;
    else if(player.onGround){
        var frac=player.walkPhase%(Math.PI*2);
        player.walkPhase+=Math.sin(frac)*0.05;
    }

    if(currentWeaponId==='gun'){
        if(player.shootCD>0)player.shootCD--;
        if(keys.KeyJ&&player.shootCD===0&&!gameOver&&!player.shieldOn){
            shoot();player.shootCD=12;
        }
        if(keys.KeyK&&player.grenadeCD===0)throwGrenade();
    }else{
        if(keys.KeyJ&&player.a1CD===0&&!gameOver){
            if(keys.KeyW)fireAirSlash();
            else meleeLight();
        }
        if(keys.KeyL&&player.defCD===0&&!gameOver)startDash();
    }
    updateMelee();

    if(player.invincible>0)player.invincible--;

    if(justI){
        if(currentWeaponId==='dualBlades'&&ultEnergy>=ULT_MAX&&!ultActive){
            triggerUlt();
        }else{
            useItem();
        }
    }

    for(var gi=grenades.length-1;gi>=0;gi--){
        var gr=grenades[gi];
        gr.x+=gr.speed*gr.dir;gr.vy+=gr.grav;gr.y+=gr.vy;gr.life--;
        var exploded=false;
        if(gr.y+gr.h>=GROUND_Y){boomSmall(gr.x+gr.w/2,GROUND_Y-10);exploded=true;}
        if(!exploded){
            for(var j=0;j<enemies.length;j++){
                if(coll(gr,enemies[j])){boomSmall(gr.x+gr.w/2,gr.y+gr.h/2);exploded=true;break;}
            }
        }
        if(!exploded&&bossActive&&boss&&bossIntroT===0){if(coll(gr,boss)){boomSmall(gr.x+gr.w/2,gr.y+gr.h/2);exploded=true;}}
        if(!exploded&&(gr.x<cameraX-20||gr.x>cameraX+W+20)){boomSmall(gr.x+gr.w/2,gr.y+gr.h/2);exploded=true;}
        if(!exploded&&gr.life<=0){boomSmall(gr.x+gr.w/2,gr.y+gr.h/2);exploded=true;}
        if(exploded)grenades.splice(gi,1);
    }
    for(var exi=explosions.length-1;exi>=0;exi--){
        explosions[exi].timer--;
        if(explosions[exi].timer<=0)explosions.splice(exi,1);
    }

    for(var si2=airSlashes.length-1;si2>=0;si2--){
        var s=airSlashes[si2];
        s.y+=s.vy;s.life--;
        if(s.life<=0||s.y<-50){airSlashes.splice(si2,1);continue;}
        var done=false;
        for(var ej=enemies.length-1;ej>=0;ej--){
            var e2=enemies[ej];
            if(s.hits.indexOf(e2)>=0)continue;
            if(coll(s,e2)){
                e2.hp-=s.damage;s.hits.push(e2);
                spawnHit(e2.x+e2.w/2,e2.y+e2.h/2,true);
                hitStop=3;
                if(e2.hp<=0){onKill(e2);enemies.splice(ej,1);if(e2.isFlyer)flyerRespawnT=getStageCfg().flyerDelay;}
                if(s.hits.length>=s.pierce){done=true;break;}
            }
        }
        if(!done&&bossActive&&boss&&bossIntroT===0&&s.hits.indexOf(boss)<0&&coll(s,boss)){
            boss.hp-=s.damage;s.hits.push(boss);
            spawnHit(boss.x+boss.w/2,boss.y+boss.h/2,true);
            hitStop=3;
        }
        if(done)airSlashes.splice(si2,1);
    }

    for(var bi=bullets.length-1;bi>=0;bi--){
        var b=bullets[bi];
        if(b.enemy&&b.flyer&&!b.tracked){
            var dx=player.x+player.w/2-b.x;
            var dy=player.y+player.h/2-b.y;
            var dd=Math.hypot(dx,dy);
            if(dd>0){
                var ts=0.3;
                var ca=Math.atan2(b.dy||0,b.dir||1);
                var ta=Math.atan2(dy,dx);
                var ad=ta-ca;
                while(ad>Math.PI)ad-=Math.PI*2;
                while(ad<-Math.PI)ad+=Math.PI*2;
                var na=ca+ad*ts;
                b.dir=Math.cos(na);b.dy=Math.sin(na);
                var len=Math.hypot(b.dir,b.dy);
                if(len>0){b.dir/=len;b.dy/=len;}
                b.tracked=true;
            }
        }
        if(b.up)b.y+=b.speed*b.dy;
        else{b.x+=b.speed*b.dir;if(b.dy!==0)b.y+=b.speed*b.dy;}
        if(b.enemy&&b.flyer){if(b.y+b.h>=GROUND_Y){bullets.splice(bi,1);continue;}}
        if(!b.enemy||!b.flyer){b.life--;if(b.life<=0){bullets.splice(bi,1);continue;}}
        if(b.x<cameraX-20||b.x>cameraX+W+20||b.y<-20||b.y>H+20){bullets.splice(bi,1);continue;}
        if(!b.enemy){
            var used=false;
            for(var eii=enemies.length-1;eii>=0;eii--){
                var e3=enemies[eii];
                if(coll(b,e3)){
                    e3.hp-=BULLET_DMG;
                    spawnHit(b.x,b.y,true);
                    if(e3.hp<=0){onKill(e3);enemies.splice(eii,1);if(e3.isFlyer)flyerRespawnT=getStageCfg().flyerDelay;}
                    used=true;break;
                }
            }
            if(!used&&bossActive&&boss&&bossIntroT===0&&coll(b,boss)){
                boss.hp-=BULLET_DMG;
                spawnHit(b.x,b.y,true);
                forestIdleT=0;used=true;
            }
            if(used)bullets.splice(bi,1);
        }else{
            var pBox2={x:player.x,y:player.y,w:player.w,h:player.h};
            if(coll(pBox2,b)){
                var rm=false;
                if(player.shieldOn&&bulletFromFront(b))rm=true;
                else if(player.itemInv>0)rm=true;
                else{hurtPlayer(25);rm=true;}
                if(rm)bullets.splice(bi,1);
            }
        }
    }

    var pcx=player.x+player.w/2;
    for(var ei2=0;ei2<enemies.length;ei2++){
        var e4=enemies[ei2];
        var edx=pcx-(e4.x+e4.w/2);
        if(worldStarTimer>0){
            var pBox3={x:player.x,y:player.y,w:player.w,h:player.h};
            if(coll(pBox3,e4)){
                if(e4.isCharger)hurtPlayer(150);
                else hurtPlayer(20);
            }
            continue;
        }
        if(e4.isFlyer){
            if(edx>5)e4.direction=1;else if(edx<-5)e4.direction=-1;
            e4.x+=e4.speed*e4.direction*0.8;
            var fo=Math.sin(Date.now()/1000+e4.hoverPhase)*5;
            e4.y=e4.baseY+fo;
            e4.x=Math.max(cameraX+10,Math.min(cameraX+W-e4.w-10,e4.x));
            e4.y=Math.max(20,Math.min(GROUND_Y-e4.h-10,e4.y));
            e4.shootTimer--;
            if(e4.shootTimer<=0&&!gameOver){
                var dx2=player.x-e4.x,dy2=player.y-e4.y;
                var d2=Math.hypot(dx2,dy2);
                if(d2>0&&d2<600){
                    bullets.push({x:e4.x+e4.w/2-4,y:e4.y+8,w:10,h:6,speed:SP.flyerBulletSpeed,
                        dir:dx2/d2,dy:dy2/d2,life:9999,enemy:true,up:false,flyer:true,tracked:false});
                    spawnMuzzle(e4.x+e4.w/2,e4.y+10,e4.direction);
                }
                e4.shootTimer=(90+Math.floor(Math.random()*70))*0.75;
            }
        }else if(e4.isCharger){
            if(e4.fuseTriggered){
                e4.fuseTimer++;
                e4.scale=1+(e4.fuseTimer/60)*0.4;
                if(e4.fuseTimer>=60){
                    var ex=e4.x+e4.w/2,ey=e4.y+e4.h/2;
                    explosions.push({x:ex-80,y:ey-80,w:160,h:160,timer:20,maxTimer:20,radius:80});
                    spawnBoom(ex,ey,80);
                    try{sIce();}catch(e){}
                    shakeAmt=Math.max(shakeAmt,8);
                    hitStop=Math.max(hitStop,4);
                    var pd=Math.hypot(player.x+player.w/2-ex,player.y+player.h/2-ey);
                    if(pd<80)hurtPlayer(100);
                    for(var jj=enemies.length-1;jj>=0;jj--){
                        if(enemies[jj]===e4)continue;
                        var ed=Math.hypot(enemies[jj].x+enemies[jj].w/2-ex,enemies[jj].y+enemies[jj].h/2-ey);
                        if(ed<80){
                            enemies[jj].hp-=50;
                            if(enemies[jj].hp<=0){onKill(enemies[jj]);enemies.splice(jj,1);}
                        }
                    }
                    enemies.splice(ei2,1);ei2--;continue;
                }
            }else{
                var pBox4={x:player.x,y:player.y,w:player.w,h:player.h};
                if(coll(pBox4,e4)){e4.fuseTriggered=true;e4.fuseTimer=0;}
                if(edx>5)e4.direction=1;else if(edx<-5)e4.direction=-1;
                e4.x+=e4.speed*e4.direction;e4.y=GROUND_Y-e4.h+2;e4.onGround=true;
                if(e4.x<cameraX-e4.w-50)e4.x=cameraX+W+20+Math.random()*50;
                else if(e4.x>cameraX+W+50)e4.x=cameraX-e4.w-20+Math.random()*50;
            }
        }else{
            var td=0;
            if(edx>5)td=1;else if(edx<-5)td=-1;
            if(!player.onGround&&td!==0)e4.lastDir=td;
            if(player.onGround){if(td!==0)e4.lastDir=td;e4.direction=e4.lastDir;}else e4.direction=e4.lastDir;
            if(e4.direction===0)e4.direction=-1;
            e4.x+=e4.speed*e4.direction*0.9;
            if(e4.x<cameraX+20){e4.x=cameraX+20;e4.direction=1;e4.lastDir=1;}
            else if(e4.x+e4.w>cameraX+W-20){e4.x=cameraX+W-20-e4.w;e4.direction=-1;e4.lastDir=-1;}
            if(e4.onGround){
                if(e4.shootState===0){
                    e4.shootTimer--;
                    if(e4.shootTimer<=0&&!gameOver){
                        var dir4=e4.direction;
                        bullets.push({x:e4.x+e4.w/2-4,y:e4.y+8,w:8,h:6,speed:SP.soldierShootSpeed,
                            dir:dir4,dy:0,life:SP.soldierBulletLife,enemy:true,up:false,flyer:false,tracked:true});
                        spawnMuzzle(e4.x+e4.w/2+dir4*10,e4.y+10,dir4);
                        e4.shootState=1;
                        var wt=40+Math.floor(Math.random()*20);
                        e4.shootTimer=Math.ceil(wt*getStageCfg().bulletMul);
                    }
                }else if(e4.shootState===1){
                    e4.shootTimer--;
                    if(e4.shootTimer<=0&&!e4.isJumpShootAction){
                        e4.isJumpShootAction=true;
                        e4.vy=e4.jumpPower;e4.onGround=false;
                        e4.isJumpShooting=true;e4.jumpShootTimer=12;
                    }
                }
            }
            e4.vy+=0.55;
            if(e4.vy>12)e4.vy=12;
            e4.y+=e4.vy;
            if(e4.y+e4.h>=GROUND_Y){
                e4.y=GROUND_Y-e4.h;e4.vy=0;e4.onGround=true;
                if(e4.isJumpShootAction){
                    e4.isJumpShootAction=false;e4.isJumpShooting=false;
                    e4.shootState=0;
                    var rt=30+Math.floor(Math.random()*20);
                    e4.shootTimer=Math.ceil(rt*getStageCfg().bulletMul);
                }
            }
            if(e4.isJumpShooting&&e4.jumpShootTimer>0){
                e4.jumpShootTimer--;
                if(e4.jumpShootTimer===0&&!gameOver){
                    var dir5=e4.direction;
                    bullets.push({x:e4.x+e4.w/2-4,y:e4.y+8,w:8,h:6,speed:SP.soldierShootSpeed,
                        dir:dir5,dy:0,life:SP.soldierBulletLife,enemy:true,up:false,flyer:false,tracked:true});
                    spawnMuzzle(e4.x+e4.w/2+dir5*10,e4.y+10,dir5);
                    e4.isJumpShooting=false;
                }
            }
            if(!e4.isJumpShootAction&&e4.onGround){
                e4.jumpTimer--;
                if(e4.jumpTimer<=0&&Math.random()<0.3){
                    e4.vy=e4.jumpPower*0.6;e4.onGround=false;
                    e4.jumpTimer=120+Math.floor(Math.random()*60);
                }
            }
        }
        if(!e4.isCharger){
            var pBox5={x:player.x,y:player.y,w:player.w,h:player.h};
            if(coll(pBox5,e4)){
                var pc=player.x+player.w/2,ec=e4.x+e4.w/2;
                if(pc<ec)player.x=e4.x-player.w-1;
                else player.x=e4.x+e4.w+1;
            }
        }
    }

    if(bossActive&&boss)updateBoss();
    if(menuMode==='mainline'&&!bossActive&&!bossCleared){
        if(stageKills>=MAIN_STAGES[currentStage].quota)spawnBoss();
    }

    var tcx=Math.max(0,Math.min(player.x+player.w/2-W/2,MAP_WIDTH-W));
    cameraX+=(tcx-cameraX)*0.15;
    if(Math.abs(tcx-cameraX)<0.5)cameraX=tcx;

    if(!gameOver&&!gameWin&&stageTransition===0){
        var gc=groundCount();var mg=getStageCfg().maxGround;
        if(gc<mg){
            groundSpawnT--;
            if(gc===0){
                spawnGround();
                if(groundCount()<mg)spawnGround();
                groundSpawnT=Math.ceil(60/getStageCfg().spawnMul);
            }else if(groundSpawnT<=0){
                spawnGround();
                groundSpawnT=Math.ceil(60/getStageCfg().spawnMul);
            }
            if(groundSpawnT<0)groundSpawnT=Math.ceil(60/getStageCfg().spawnMul);
        }
        var fc=flyerCount();var mf=getStageCfg().maxFlyers;
        if(fc<mf){
            flyerSpawnT--;
            if(fc===0&&flyerRespawnT>0){}
            else if(flyerSpawnT<=0){spawnFlyer();flyerSpawnT=getFlyerDelay();}
        }else if(flyerSpawnT<=0)flyerSpawnT=10;
        if(fc===0&&flyerRespawnT<=0&&!gameOver&&gameStarted){
            if(flyerSpawnT>1)flyerSpawnT=1;
        }
    }
    if(keys.Escape&&gameStarted&&!endlessShopOpen&&!keyHelpOpen){
        if(gameOver||gameWin){returnMenu();}
        else if(!gameOver&&!gamePaused){
            if(confirm('确定返回主菜单吗？进度将丢失。'))returnMenu();
        }
    }
}

function drawLogo(){
    ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
    for(var i=0;i<50;i++){
        var x=(i*137+50)%W,y=(i*251+30)%H,s=1+(i%3);
        ctx.fillStyle='rgba(255,255,255,'+(0.1+(i%5)*0.05)+')';
        ctx.fillRect(x,y,s,s);
    }
    if(!logoReady||!logoImage||!logoImage.complete||logoImage.naturalWidth===0){
        ctx.fillStyle='#ffcc44';ctx.font='24px "Courier New",monospace';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('加载中...',W/2,H/2);
        ctx.textAlign='left';ctx.textBaseline='alphabetic';
        return;
    }
    var el=Date.now()-logoStart;var pr=Math.min(el/2000,1);
    var ease=1-Math.pow(1-pr,3);var sc=0.5+ease*0.5;var al=Math.min(ease*1.5,1);
    var iw=logoImage.width||logoImage.naturalWidth,ih=logoImage.height||logoImage.naturalHeight;
    var dw=iw*sc,dh=ih*sc;
    if(dw>W*0.85){dw=W*0.85;dh=dw*(ih/iw);}
    if(dh>H*0.85){dh=H*0.85;dw=dh*(iw/ih);}
    ctx.globalAlpha=al;
    ctx.drawImage(logoImage,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.globalAlpha=1;
    if(pr<1){
        var bw=240,bh=4,bx=(W-bw)/2,by=H-40;
        ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(bx,by,bw,bh);
        var g=ctx.createLinearGradient(bx,by,bx+bw*ease,by);
        g.addColorStop(0,'#ffd700');g.addColorStop(1,'#ffed4a');
        ctx.fillStyle=g;ctx.fillRect(bx,by,bw*ease,bh);
    }
    ctx.globalAlpha=0.3+Math.sin(Date.now()/800)*0.15;
    ctx.fillStyle='#8899bb';ctx.font='14px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('按任意键继续...',W/2,H-15);
    ctx.globalAlpha=1;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    if(pr>=1)logoComplete=true;
}

function drawPlayer(){
    var p=player;
    var flicker=(p.invincible>0||p.itemInv>0)&&Math.floor(Date.now()/80)%2===0;
    var prevA=ctx.globalAlpha;
    if(flicker)ctx.globalAlpha=0.55;
    if(p.itemInv>0){
        ctx.shadowColor='#ffd700';ctx.shadowBlur=25;
        ctx.strokeStyle='rgba(255,215,0,0.7)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,p.w+8,0,Math.PI*2);ctx.stroke();
        ctx.shadowBlur=0;
    }
    if(p.slowTimer>0){
        var si=Math.min(1,p.slowTimer/60);
        for(var i=0;i<3;i++){
            var t2=(Date.now()/500+i)%1;
            var sx=p.x+Math.sin(Date.now()/200+i)*12+p.w/2;
            var sy=p.y-5-t2*12;
            ctx.fillStyle='rgba(200,240,255,'+(0.8*si*(1-t2))+')';
            ctx.beginPath();ctx.arc(sx,sy,2+t2*2,0,Math.PI*2);ctx.fill();
        }
    }
    if(parryWindow>0&&currentWeaponId==='dualBlades'){
        var pulse=0.6+Math.sin(Date.now()/60)*0.4;
        ctx.strokeStyle='rgba(255,255,255,'+pulse+')';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,32,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle='rgba(255,220,100,'+pulse+')';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,26,0,Math.PI*2);ctx.stroke();
    }
    var dir=p.facingRight?1:-1;
    var t=p.walkPhase||0;
    var cx=p.x+p.w/2;
    var state='idle';
    if(p.isCrouching)state='crouch';
    else if(!p.onGround)state='jump';
    else if(p.throwTimer>0)state='throw';
    else if(p.shootTimer>0&&(keys.KeyJ||p.shootingUp))state='shoot';
    else if(Math.abs(p.vx)>0.5)state='walk';
    var walkAmt=Math.min(1,Math.abs(p.vx)/3.5);
    var legA=0,legB=0,bodyBob=0,armSwing=0;
    if(state==='walk'){
        legA=Math.sin(t)*5*walkAmt;legB=Math.sin(t+Math.PI)*5*walkAmt;
        bodyBob=Math.abs(Math.sin(t*2))*1.5*walkAmt;
        armSwing=-Math.sin(t)*1.8*walkAmt;
    }else if(state==='idle'){bodyBob=Math.sin(Date.now()/400)*0.5;}
    else if(state==='jump'){legA=-3;legB=3;}
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath();ctx.ellipse(cx,GROUND_Y+3,p.w*0.42,3,0,0,Math.PI*2);ctx.fill();
    var topY=p.y+bodyBob,headH=8,headTop=topY,torsoTop=headTop+headH;
    var torsoH=p.isCrouching?8:14;
    var torsoBot=torsoTop+torsoH,legTop=torsoBot,legBot=p.y+p.h;
    var legH=Math.max(2,legBot-legTop);
    var lean=p.isCrouching?dir*1.5:0;
    // 后腿
    drawPlayerLeg(cx-3+lean,legTop,legBot,legH,legA,dir,'#3a4a6a','#2a3a5a');
    // 躯干
    ctx.fillStyle='#2a3a5a';ctx.fillRect(cx-6+lean,torsoTop+1,12,torsoH);
    ctx.fillStyle='#4a5a6a';ctx.fillRect(cx-6+lean,torsoTop,12,torsoH);
    ctx.fillStyle='#5a6a7a';ctx.fillRect(cx-6+lean,torsoTop,12,1);ctx.fillRect(cx-6+lean,torsoTop,1,torsoH);
    ctx.fillStyle='#1a1a2a';ctx.fillRect(cx-5+lean,torsoTop,10,3);
    ctx.fillRect(cx-4+lean,torsoTop+5,8,1);
    ctx.fillRect(cx-4+lean,torsoTop+8,8,1);
    ctx.fillStyle='#c8a040';ctx.fillRect(cx-1+lean,torsoTop+6,2,2);
    ctx.fillRect(cx-6+lean,torsoTop+2,2,1);
    ctx.fillRect(cx+4+lean,torsoTop+2,2,1);
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(cx+2+lean,torsoTop+2,3,torsoH-3);
    // 前腿
    drawPlayerLeg(cx+1+lean,legTop,legBot,legH,legB,dir,'#4a5a7a','#3a4a6a');
    // 头

        // 前手刀
        var fHX=cx+dir*5+lean,fHY=shoulderY+6;

            ctx.strokeStyle='#e8d0b8';
            ctx.beginPath();ctx.moveTo(cx+dir*3+lean,shoulderY+2);ctx.lineTo(sX+dir*6,sY+16);ctx.stroke();
        }else if(state==='throw'){
            var tt=1-p.throwTimer/26;

            if(tt<0.35)aa=-Math.PI*0.75;

            ctx.strokeStyle='#d4bca0';ctx.lineWidth=2.5;
            ctx.beginPath();ctx.moveTo(cx-dir*3+lean,shoulderY+2);ctx.lineTo(cx-dir*3+lean,shoulderY+8);ctx.stroke();
            var aX=cx+lean+dir*2,aY=shoulderY+1;
            var hX=aX+Math.cos(aa)*11*dir,hY=aY+Math.sin(aa)*11;
            ctx.strokeStyle='#e8d0b8';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(aX,aY);ctx.lineTo(hX,hY);ctx.stroke();
            if(tt<0.55){

            ctx.beginPath();ctx.moveTo(cx-dir*3+lean,shoulderY+2);ctx.lineTo(cx-dir*3+lean,shoulderY+8);ctx.stroke();
            ctx.strokeStyle='#e8d0b8';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(aX2,shoulderY+1);ctx.lineTo(aX2,shoulderY-8);ctx.stroke();
            var recoil=state==='shoot'?2:0;
            ctx.fillStyle='#3a3a3a';ctx.fillRect(aX2-2,shoulderY-16+recoil,4,10);
            ctx.fillStyle='#5a5a5a';ctx.fillRect(aX2-1,shoulderY-16+recoil,2,2);
            ctx.fillStyle='#2a2a2a';ctx.fillRect(aX2-1,shoulderY-18+recoil,2,3);
        }else if(state==='shoot'||state==='crouch'){
            var gy=shoulderY+(p.isCrouching?3:2);
            ctx.strokeStyle='#d4bca0';ctx.lineWidth=2.5;
            ctx.beginPath();ctx.moveTo(cx-dir*2+lean,gy);ctx.lineTo(cx+dir*3+lean,gy+1);ctx.stroke();
            var recoil2=state==='shoot'?-2*dir:0;
            var gX=(dir>0?cx+2:cx-14)+lean;
            ctx.fillStyle='#3a3a3a';ctx.fillRect(gX+recoil2,gy-2,12,4);
            ctx.fillStyle='#2a2a2a';
            if(dir>0)ctx.fillRect(gX+11+recoil2,gy-1,4,2);
            else ctx.fillRect(gX-3+recoil2,gy-1,4,2);
            ctx.strokeStyle='#e8d0b8';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(cx+dir*2+lean,gy-2);ctx.lineTo(gX+dir*4+recoil2,gy);ctx.stroke();
            if(state==='shoot'){
                var fx=dir>0?gX+15+recoil2:gX-5+recoil2;
                var fl=0.7+Math.random()*0.3;
                ctx.fillStyle='rgba(255,240,150,'+fl+')';ctx.fillRect(fx-2,gy-3,6,6);
                ctx.fillStyle='rgba(255,180,60,'+(fl*0.9)+')';ctx.fillRect(fx-1,gy-2,4,4);
                ctx.fillStyle='rgba(255,255,220,'+fl+')';ctx.fillRect(fx+1,gy-1,2,2);
            }
        }else{
            var gy2=shoulderY+2;
            ctx.strokeStyle='#d4bca0';ctx.lineWidth=2.5;
            ctx.beginPath();ctx.moveTo(cx-dir*3+lean,gy2);ctx.lineTo(cx-dir*3+armSwing*dir+lean,gy2+6);ctx.stroke();
            ctx.strokeStyle='#e8d0b8';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(cx+dir*3+lean,gy2);ctx.lineTo(cx+dir*3-armSwing*dir+lean,gy2+6);ctx.stroke();
            var gX2=(dir>0?cx+dir*2:cx-9)+lean;var gY=gy2+7;
            ctx.fillStyle='#3a3a3a';ctx.fillRect(gX2,gY,8,3);
            ctx.fillStyle='#2a2a2a';ctx.fillRect(gX2+6,gY+3,3,2);
        }
        if(p.shieldOn){
            var sX2=p.facingRight?p.x+p.w-6:p.x-18;
            var sY2=p.y-2;var sw=24,sh=p.h+4;
            ctx.shadowColor='#88eeff';ctx.shadowBlur=22;
            ctx.fillStyle='rgba(68,221,255,0.18)';
            ctx.fillRect(sX2-4,sY2-2,sw+8,sh+4);
            ctx.shadowBlur=15;
            var g2=ctx.createLinearGradient(sX2,sY2,sX2+sw,sY2+sh);

            g2.addColorStop(0.5,'rgba(68,221,255,0.85)');
            g2.addColorStop(1,'rgba(68,221,255,0.55)');
            ctx.fillStyle=g2;ctx.fillRect(sX2,sY2,sw,sh);
            ctx.shadowBlur=0;
            ctx.strokeStyle='#44ddff';ctx.lineWidth=2;
            ctx.strokeRect(sX2,sY2,sw,sh);
            ctx.strokeStyle='rgba(200,255,255,0.7)';ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(sX2+sw/2,sY2);ctx.lineTo(sX2+sw/2,sY2+sh);
            ctx.moveTo(sX2,sY2+sh/2);ctx.lineTo(sX2+sw,sY2+sh/2);
            ctx.stroke();
        }
    }
    ctx.globalAlpha=prevA;
}
function drawAfterimages(){
    for(var i=0;i<player.dashAfterimages.length;i++){
        var img=player.dashAfterimages[i];

        ctx.globalAlpha=a*0.5;
        ctx.fillStyle='#88ddff';
        ctx.shadowColor='#88ddff';ctx.shadowBlur=10;
        ctx.fillRect(img.x,img.y,player.w,player.h);
        ctx.shadowBlur=0;

    }
}
function drawAirSlashes(){
    for(var i=0;i<airSlashes.length;i++){
        var s=airSlashes[i];
        ctx.save();
        ctx.translate(s.x+s.w/2,s.y+s.h/2);
        var a=Math.min(1,s.life/20);
        ctx.globalAlpha=a;
        ctx.fillStyle='#ff66aa';
        ctx.shadowColor='#ff99cc';ctx.shadowBlur=15;
        ctx.beginPath();
        ctx.moveTo(-15,0);ctx.quadraticCurveTo(-5,-14,15,0);
        ctx.quadraticCurveTo(-5,14,-15,0);ctx.closePath();ctx.fill();

}
function drawEnemySoldier(e,time){

        ctx.beginPath();ctx.arc(cx+lean,torsoTop+5,5,0,Math.PI*2);ctx.fill();

        var armY=bodyY+bodyH*0.3-armLift;
        ctx.fillStyle='#3a3a3a';ctx.fillRect(ax,armY,20,16);
        ctx.fillStyle='#5a5a5a';ctx.fillRect(ax+2,armY+2,16,4);
        ctx.fillStyle='#1a1a1a';
        ctx.beginPath();ctx.arc(ax+10,armY+16,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#2a2a2a';
        ctx.fillRect(ax+4,armY+16,12,10);
        ctx.fillStyle='#1a1a1a';
        ctx.fillRect(ax+dirS*4,armY+20,8,4);
        ctx.fillRect(ax+dirS*4,armY+26,8,4);
    }
    var eY=bodyY+bodyH*0.22;
    var eW=b.w*0.12,eH=b.h*0.06;
    var eyeGlow=ctx.createRadialGradient(cx-b.w*0.22,eY,0,cx-b.w*0.22,eY,eW*2.5);
    eyeGlow.addColorStop(0,'rgba(255,60,40,0.8)');
    eyeGlow.addColorStop(1,'rgba(255,60,40,0)');
    ctx.fillStyle=eyeGlow;
    ctx.fillRect(cx-b.w*0.22-eW*2.5,eY-eH*2.5,eW*5,eH*5);
    var eyeGlow2=ctx.createRadialGradient(cx+b.w*0.22,eY,0,cx+b.w*0.22,eY,eW*2.5);
    eyeGlow2.addColorStop(0,'rgba(255,60,40,0.8)');
    eyeGlow2.addColorStop(1,'rgba(255,60,40,0)');
    ctx.fillStyle=eyeGlow2;
    ctx.fillRect(cx+b.w*0.22-eW*2.5,eY-eH*2.5,eW*5,eH*5);
    ctx.fillStyle='#ff3311';
    ctx.fillRect(cx-b.w*0.28,eY,eW,eH);
    ctx.fillRect(cx+b.w*0.28-eW,eY,eW,eH);
    ctx.fillStyle='#ffdd44';
    ctx.fillRect(cx-b.w*0.28+eW*0.3,eY+eH*0.3,eW*0.4,eH*0.4);
    ctx.fillRect(cx+b.w*0.28-eW+eW*0.3,eY+eH*0.3,eW*0.4,eH*0.4);
    var coreY=bodyY+bodyH*0.45;
    var coreR=b.w*0.14;
    var corePulse=Math.sin(time*6)*0.5+0.5;
    var coreGlow=ctx.createRadialGradient(cx,coreY,0,cx,coreY,coreR*3);
    coreGlow.addColorStop(0,'rgba(255,60,20,0.85)');
    coreGlow.addColorStop(0.4,'rgba(255,100,30,'+(0.5+corePulse*0.3)+')');
    coreGlow.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle=coreGlow;
    ctx.fillRect(cx-coreR*3,coreY-coreR*3,coreR*6,coreR*6);
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();ctx.arc(cx,coreY,coreR*1.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff5533';
    ctx.beginPath();ctx.arc(cx,coreY,coreR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffdd44';
    ctx.beginPath();ctx.arc(cx,coreY,coreR*0.55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(cx,coreY,coreR*0.28,0,Math.PI*2);ctx.fill();
    var cannonY=bodyY+bodyH*0.82;
    var cannonW=b.w*0.5;
    ctx.fillStyle='#0a0a0a';
    ctx.beginPath();ctx.arc(cx,cannonY,cannonW*0.35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();ctx.arc(cx,cannonY,cannonW*0.28,0,Math.PI*2);ctx.fill();
    var cannonGlow=attackAnim>0.3?1:(Math.sin(time*8)*0.5+0.5);
    var cannonGrad=ctx.createRadialGradient(cx,cannonY,0,cx,cannonY,cannonW*0.3);
    cannonGrad.addColorStop(0,'rgba(255,220,100,'+cannonGlow+')');
    cannonGrad.addColorStop(0.5,'rgba(255,100,30,'+(cannonGlow*0.8)+')');
    cannonGrad.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle=cannonGrad;
    ctx.beginPath();ctx.arc(cx,cannonY,cannonW*0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,200,'+cannonGlow+')';
    ctx.beginPath();ctx.arc(cx,cannonY,cannonW*0.12,0,Math.PI*2);ctx.fill();
    var warn=0.4+Math.sin(time*5)*0.5;
    ctx.fillStyle='rgba(255,0,0,'+warn+')';
    ctx.fillRect(b.x+b.w-18,bodyY-4-topLift,6,4);
    ctx.fillRect(b.x+12,bodyY-4-topLift,6,4);
    ctx.shadowColor='#ff0000';ctx.shadowBlur=8;
    ctx.fillRect(b.x+b.w-18,bodyY-4-topLift,6,4);
    ctx.fillRect(b.x+12,bodyY-4-topLift,6,4);
    ctx.shadowBlur=0;
    ctx.fillStyle='#2a2a2a';
    ctx.fillRect(b.x+b.w*0.25-5,bodyY-22-topLift,10,20);
    ctx.fillRect(b.x+b.w*0.65-5,bodyY-22-topLift,10,20);
    ctx.fillStyle='#4a4a4a';
    ctx.fillRect(b.x+b.w*0.25-4,bodyY-22-topLift,3,20);
    ctx.fillRect(b.x+b.w*0.65-4,bodyY-22-topLift,3,20);
}
function drawBossAttacks(){
    for(var i=0;i<forestVines.length;i++){
        var v=forestVines[i];var t=v.t;
        if(t<=v.flightDur){
            var prog=t/v.flightDur;
            var e=1-Math.pow(1-prog,2);
            var cX=v.startX+(v.targetX-v.startX)*e;
            var cY=v.startY+(v.targetY-v.startY)*e;
            ctx.strokeStyle='#1a3a1a';ctx.lineWidth=10;
            ctx.beginPath();ctx.moveTo(v.startX,v.startY);
            var cX2=(v.startX+cX)*0.5+30,cY2=(v.startY+cY)*0.5-20;
            ctx.quadraticCurveTo(cX2,cY2,cX,cY);ctx.stroke();
            ctx.strokeStyle='#2e5a3a';ctx.lineWidth=6;ctx.stroke();
            ctx.strokeStyle='#4a8a4a';ctx.lineWidth=2;ctx.stroke();
        }else if(v.hit){
            var restT=(v.t-v.flightDur)/v.restDur;
            ctx.globalAlpha=1-restT*0.3;
            ctx.strokeStyle='#1a3a1a';ctx.lineWidth=10;
            ctx.beginPath();ctx.moveTo(v.startX,v.startY);
            var cX3=(v.startX+v.targetX)*0.5+30,cY3=(v.startY+v.targetY)*0.5-20;
            ctx.quadraticCurveTo(cX3,cY3,v.targetX,v.targetY);ctx.stroke();
            ctx.strokeStyle='#2e5a3a';ctx.lineWidth=6;ctx.stroke();
            ctx.globalAlpha=1;
        }
    }
    for(var j=0;j<snowIceBalls.length;j++){
        var b=snowIceBalls[j];
        if(b.exploded){
            var t2=b.t/20;
            var alpha=1-t2;
            if(t2<1){
                ctx.fillStyle='rgba(255,255,255,'+(alpha*0.5)+')';
                ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1+t2*1.5),0,Math.PI*2);ctx.fill();
            }
            continue;
        }
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.rotate(b.rot);
        ctx.shadowColor='#88ddff';ctx.shadowBlur=25;
        ctx.fillStyle='#88bbdd';
        ctx.beginPath();
        for(var k=0;k<8;k++){
            var ang=k*Math.PI/4;
            var rr=b.r*(0.9+Math.sin(k*2+b.rot*2)*0.1);
            if(k===0)ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
            else ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
        }
        ctx.closePath();ctx.fill();
        ctx.fillStyle='#c8e8ff';
        ctx.beginPath();
        for(var k2=0;k2<8;k2++){
            var ang2=k2*Math.PI/4+0.2;
            var rr2=b.r*0.7;
            if(k2===0)ctx.moveTo(Math.cos(ang2)*rr2,Math.sin(ang2)*rr2);
            else ctx.lineTo(Math.cos(ang2)*rr2,Math.sin(ang2)*rr2);
        }
        ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(-b.r*0.3,-b.r*0.3,b.r*0.3,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.restore();
    }
    for(var m=0;m<factoryMissiles.length;m++){
        var mm=factoryMissiles[m];
        if(mm.state==='waiting')continue;
        if(mm.state==='flying'){
            ctx.save();
            ctx.translate(mm.x,mm.y);
            var angle=Math.atan2(mm.targetY-(-80),mm.targetX-(mm.targetX+120));
            ctx.rotate(angle);
            ctx.fillStyle='#4a4a4a';
            ctx.beginPath();
            ctx.moveTo(10,0);ctx.lineTo(-8,-4);ctx.lineTo(-8,4);
            ctx.closePath();ctx.fill();
            ctx.fillStyle='#6a6a6a';
            ctx.fillRect(-8,-4,12,2);
            ctx.fillStyle='#8a2a2a';
            ctx.beginPath();
            ctx.moveTo(10,0);ctx.lineTo(4,-4);ctx.lineTo(4,4);
            ctx.closePath();ctx.fill();
            ctx.fillStyle='#2a2a2a';
            ctx.beginPath();
            ctx.moveTo(-8,-4);ctx.lineTo(-12,-8);ctx.lineTo(-8,-6);
            ctx.closePath();ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-8,4);ctx.lineTo(-12,8);ctx.lineTo(-8,6);
            ctx.closePath();ctx.fill();
            var flameLen=6+Math.random()*5;
            ctx.fillStyle='#ffdd44';
            ctx.fillRect(-8-flameLen,-2,flameLen,4);
            ctx.fillStyle='#ff8833';
            ctx.fillRect(-8-flameLen*0.7,-1,flameLen*0.7,2);
            ctx.fillStyle='#ffffcc';
            ctx.fillRect(-8-flameLen*0.3,-1,flameLen*0.3,2);
            ctx.restore();
        }
    }
}
function draw(){
    ctx.clearRect(0,0,W,H);
    if(!logoComplete){drawLogo();return;}
    if(keyHelpOpen){drawKeyHelp();return;}
    if(weaponSelOpen){drawWeaponSel();return;}
    if(!gameStarted){drawMenu();if(shopOpen)drawShop();return;}
    if(story){drawBg();drawStory();return;}
    if(endlessShopOpen){drawBg();drawPlayer();drawParts();drawEndlessShop();return;}
    if(stageTransition>0&&stageTransType!==null){drawBg();drawPlayer();drawStageTrans();return;}

    if(shakeAmt>0.5)shakeAmt*=0.85;else shakeAmt=0;
    var sx=(Math.random()-0.5)*shakeAmt,sy=(Math.random()-0.5)*shakeAmt;
    ctx.save();
    ctx.translate(-cameraX+sx,sy);
    drawBg();
    if(menuMode==='endless'){
        ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
        ctx.setLineDash([4,8]);
        ctx.beginPath();
        ctx.moveTo(cameraX+REGION_W,0);ctx.lineTo(cameraX+REGION_W,GROUND_Y);
        ctx.moveTo(cameraX+REGION_W*2,0);ctx.lineTo(cameraX+REGION_W*2,GROUND_Y);
        ctx.stroke();ctx.setLineDash([]);
    }
    for(var i=0;i<explosions.length;i++){
        var exp=explosions[i];
        var p=exp.timer/exp.maxTimer;
        var r=exp.radius*(1-p*0.3);
        var a=p;
        var g=ctx.createRadialGradient(exp.x+exp.w/2,exp.y+exp.h/2,0,exp.x+exp.w/2,exp.y+exp.h/2,r);
        g.addColorStop(0,'rgba(255,255,220,'+a+')');
        g.addColorStop(0.3,'rgba(255,200,100,'+a+')');
        g.addColorStop(0.6,'rgba(255,100,50,'+(a*0.8)+')');
        g.addColorStop(1,'rgba(255,50,20,0)');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(exp.x+exp.w/2,exp.y+exp.h/2,r,0,Math.PI*2);ctx.fill();
    }
    for(var gr=0;gr<grenades.length;gr++){
        var gg=grenades[gr];
        ctx.fillStyle='#44cc88';
        ctx.shadowColor='#44cc88';ctx.shadowBlur=10;
        ctx.fillRect(gg.x,gg.y,gg.w,gg.h);
        ctx.fillStyle='#88ffbb';
        ctx.fillRect(gg.x+2,gg.y+2,4,4);
        ctx.fillRect(gg.x+6,gg.y+6,4,4);
        ctx.fillStyle='#2a5a3a';
        ctx.fillRect(gg.x+4,gg.y-2,4,3);
        ctx.shadowBlur=0;
    }
    for(var b=0;b<bullets.length;b++){
        var bb=bullets[b];
        ctx.shadowColor=bb.enemy?'#ff8866':'#fff5b0';
        ctx.shadowBlur=12;
        if(bb.up){
            ctx.fillStyle=bb.enemy?'#ff6a3d':'#66ddff';
            ctx.fillRect(bb.x,bb.y,bb.w,bb.h);
            ctx.fillStyle=bb.enemy?'#ffb085':'#aaffff';
            ctx.fillRect(bb.x+1,bb.y+2,4,6);
        }else{
            ctx.fillStyle=bb.enemy?'#ff6a3d':'#fced7a';
            ctx.fillRect(bb.x,bb.y,bb.w,bb.h);
            ctx.fillStyle=bb.enemy?'#ffb085':'#fffec4';
            ctx.fillRect(bb.x+2,bb.y+1,4,3);
        }
        ctx.shadowBlur=0;
    }
    var nt=Date.now()/1000;
    for(var ei=0;ei<enemies.length;ei++){
        var e=enemies[ei];
        if(e.isFlyer)drawEnemyFlyer(e,nt);
        else drawEnemySoldier(e,nt);
        var hpP=e.hp/e.maxHp;
        if(hpP<1){
            ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(e.x-1,e.y-10,e.w+2,6);
            ctx.fillStyle=e.isFlyer?'#44aaff':(e.isCharger?'#ff8844':'#d94f4f');
            ctx.fillRect(e.x,e.y-9,e.w*hpP,4);
        }
    }
    if(bossActive&&boss){
        if(bossIntroT>0){
            var t3=1-bossIntroT/BOSS_INTRO_FRAMES;
            var sX=cameraX+W+(boss.x-cameraX-W)*t3;
            var a2=Math.min(1,t3*2);
            ctx.globalAlpha=a2;
            ctx.fillStyle='#fff';
            ctx.font='bold 32px "Courier New",monospace';
            ctx.textAlign='center';
            ctx.shadowColor=boss.color;ctx.shadowBlur=20;
            ctx.fillText('⚠ '+boss.name+' 出现！',W/2,H/2-40);
            ctx.shadowBlur=0;
            ctx.globalAlpha=1;
        }else{
            if(bossWarnT>0){
                var p2=1-bossWarnT/WARN_FRAMES;
                var stage=MAIN_STAGES[boss.stageIndex];
                var pulse=Math.sin(Date.now()/80)*0.5+0.5;
                if(stage.id==='forest'){
                    var tx=boss.attackTargetX!==null?boss.attackTargetX:(player.x+player.w/2);
                    var tY=GROUND_Y-5;
                    var ringR=70;
                    ctx.strokeStyle='rgba(255,80,40,'+(0.75+pulse*0.25)+')';
                    ctx.lineWidth=4;
                    ctx.beginPath();
                    ctx.ellipse(tx,tY,ringR*(1-p2*0.35),20*(1-p2*0.35),0,0,Math.PI*2);
                    ctx.stroke();
                    ctx.strokeStyle='rgba(255,100,50,0.95)';ctx.lineWidth=3;
                    ctx.beginPath();
                    ctx.moveTo(tx-ringR*0.85,tY);ctx.lineTo(tx-ringR*0.3,tY);
                    ctx.moveTo(tx+ringR*0.3,tY);ctx.lineTo(tx+ringR*0.85,tY);
                    ctx.moveTo(tx,tY-32);ctx.lineTo(tx,tY-10);
                    ctx.stroke();
                    ctx.font='bold 32px "Courier New",monospace';
                    ctx.fillStyle='rgba(255,80,40,'+(0.5+pulse*0.5)+')';
                    ctx.textAlign='center';
                    ctx.fillText('⚠',tx,tY-40);
                    ctx.textAlign='left';
                    ctx.strokeStyle='rgba(255,80,40,'+(0.3+p2*0.4)+')';
                    ctx.lineWidth=3;
                    ctx.setLineDash([10,8]);
                    ctx.beginPath();
                    ctx.moveTo(cameraX+W+30,-40);
                    ctx.lineTo(tx,tY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }else if(stage.id==='snow'){
                    var gx=boss.x+boss.w*0.3;
                    var gy=boss.y+boss.h*0.4;
                    var gr2=8+p2*12;
                    ctx.fillStyle='rgba(200,240,255,0.7)';
                    ctx.beginPath();ctx.arc(gx,gy,gr2,0,Math.PI*2);ctx.fill();
                }else if(stage.id==='factory'){
                    if(boss.hp<boss.maxHp/2){
                        for(var i=0;i<3;i++){
                            var bx2=Math.max(40,boss.x-80-(i+1)*150);
                            ctx.fillStyle='rgba(255,120,30,'+(0.15+p2*0.25)+')';
                            ctx.beginPath();ctx.arc(bx2,GROUND_Y-40,80,0,Math.PI*2);ctx.fill();
                        }
                    }else{
                        var sX2=cameraX+W/2-50;
                        var eX=cameraX+W;
                        ctx.fillStyle='rgba(255,100,50,'+(0.15+Math.sin(Date.now()/60)*0.1)+')';
                        ctx.fillRect(sX2,GROUND_Y-120,eX-sX2,120);
                    }
                }
            }
            if(fChargeActive){
                var cl=fChargePos-F_CHARGE_W/2;
                var cr=fChargePos+F_CHARGE_W/2;
                var grad=ctx.createLinearGradient(cl,0,cr,0);
                grad.addColorStop(0,'rgba(255,100,50,0.1)');
                grad.addColorStop(0.5,'rgba(255,150,80,0.75)');
                grad.addColorStop(1,'rgba(255,100,50,0.1)');
                ctx.fillStyle=grad;
                ctx.fillRect(cl,GROUND_Y-150,F_CHARGE_W,150);
                ctx.strokeStyle='rgba(255,220,100,0.9)';ctx.lineWidth=3;
                ctx.strokeRect(cl,GROUND_Y-150,F_CHARGE_W,150);
            }
            if(boss.stageId==='forest')drawForestBoss(boss,nt);
            else if(boss.stageId==='snow')drawSnowBoss(boss,nt);
            else drawFactoryBoss(boss,nt);
            ctx.fillStyle='#fff';
            ctx.font='bold 16px "Courier New",monospace';
            ctx.textAlign='center';
            ctx.shadowColor=boss.color;ctx.shadowBlur=10;
            ctx.fillText(boss.name,boss.x+boss.w/2,boss.y-20);
            ctx.shadowBlur=0;
            var bW=400,bH=20,bX=W/2-bW/2,bY=20;
            ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(bX-2,bY-2,bW+4,bH+4);
            ctx.fillStyle='#3a1a1a';ctx.fillRect(bX,bY,bW,bH);
            var hpP2=Math.max(0,boss.hp/boss.maxHp);
            ctx.fillStyle=boss.color;
            ctx.fillRect(bX,bY,bW*hpP2,bH);
            ctx.fillStyle='rgba(255,255,255,0.25)';
            ctx.fillRect(bX,bY,bW*hpP2,bH*0.4);
            ctx.strokeStyle='#fff';ctx.lineWidth=2;
            ctx.strokeRect(bX,bY,bW,bH);
            ctx.fillStyle='#fff';
            ctx.font='bold 14px "Courier New",monospace';
            ctx.textAlign='center';
            ctx.fillText(boss.name+'  '+Math.max(0,Math.ceil(boss.hp))+' / '+boss.maxHp,W/2,bY+bH/2+5);
            ctx.textAlign='left';
        }
    }
    drawPlayer();
    drawAfterimages();
    drawBossAttacks();
    drawParts();
    drawAirSlashes();
    ctx.restore();

    // 大招水墨滤镜
    var filtA=ultActive?0.65:(ultFlash>0?(ultFlash/25)*0.65:0);
    if(filtA>0){
        ctx.fillStyle='rgba(15,15,25,'+(filtA*0.7)+')';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle='rgba(180,20,40,'+(filtA*0.28)+')';
        ctx.fillRect(0,0,W,H);
        if(ultActive){
            var wpn=getW();
            var t4=ultTimer;
            var alpha=1;
            if(t4<5)alpha=t4/5;
            else if(t4>wpn.ultDuration-20)alpha=(wpn.ultDuration-t4)/20;
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.font='bold 76px "Courier New",monospace';
            ctx.strokeStyle='rgba(0,0,0,'+alpha+')';
            ctx.lineWidth=8;
            ctx.strokeText(wpn.ultName,W/2,H/2);
            var gg2=ctx.createLinearGradient(W/2-200,H/2-40,W/2+200,H/2+40);
            gg2.addColorStop(0,'rgba(255,60,90,'+alpha+')');
            gg2.addColorStop(0.5,'rgba(255,220,120,'+alpha+')');
            gg2.addColorStop(1,'rgba(255,60,90,'+alpha+')');
            ctx.fillStyle=gg2;
            ctx.fillText(wpn.ultName,W/2,H/2);
            ctx.font='bold 20px "Courier New",monospace';
            ctx.fillStyle='rgba(255,240,210,'+alpha+')';
            ctx.fillText('—— 双 刀 · 奥 义 ——',W/2,H/2-62);
            ctx.textAlign='left';ctx.textBaseline='alphabetic';
        }
    }
    if(parryFlash>0){
        var a3=parryFlash/18;
        ctx.fillStyle='rgba(255,255,255,'+(a3*0.5)+')';
        ctx.fillRect(0,0,W,H);
    }
    drawUI();
    if(gameOver)drawGameOver();
    if(gameWin)drawGameWin();
}
function drawUI(){
    ctx.textAlign='left';ctx.textBaseline='top';
    var hpX=14,hpY=14,hpW=200,hpH=18;
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(hpX-3,hpY-3,hpW+6,hpH+6);
    ctx.fillStyle='#3a2a2a';ctx.fillRect(hpX,hpY,hpW,hpH);
    var hpP=Math.max(0,player.hp/player.maxHp);
    ctx.fillStyle='#e84848';ctx.fillRect(hpX,hpY,hpW*hpP,hpH);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(hpX,hpY,hpW*hpP,hpH*0.4);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Courier New",monospace';
    ctx.textBaseline='middle';

    for(var i=0;i<inventory.length;i++){
        var slot=inventory[i];
        var item=ITEMS[slot.id];
        var sx=hpX+2+i*95,sy=hpY+hpH+132;
        ctx.fillStyle=currentItemSlot===i?'rgba(255,215,0,0.25)':'rgba(0,0,0,0.5)';
        ctx.fillRect(sx,sy,90,26);
        ctx.strokeStyle=currentItemSlot===i?'#ffd700':'rgba(120,140,180,0.4)';

        drawItemIcon(slot.id,sx+4,sy+3,20);
        ctx.fillStyle=item.color;
        ctx.font='bold 12px "Courier New",monospace';
